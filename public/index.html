<!-- ESCOPO CONSOLIDADO DA ATUALIZAÇÃO
1. Corrigir IDs e validar pai/mãe sem modificar automaticamente o sexo das aves.
2. Integrar casal, temporada, tentativa, ninhada, ovos e filhotes por referências; proteger o histórico.
3. Registrar separação individual, situação com os pais e idade em dias.
4. Manejo: atividades predefinidas, múltiplas aves, selecionar todas, sem campo Responsável.
5. Alimentação: múltiplas aves, sem Unidade/Frequência/Horário; catálogo padrão editável com composição fornecida.
6. Preservar oito campos do plantel, identidade visual, chave de armazenamento, dados legados e backups.
Limite do arquivo recebido: armazenamento local, sem API, servidor ou sincronização híbrida.
-->

function financeTotals(period,expenses=expenseRows()){
 const includes=date=>typeof date==='string'&&date.startsWith(period);
 const totals={received:0,refunds:0,receivable:0,paid:0,payable:0};
 for(const sale of db.revenues){
  const amount=moneyCents(sale.value);
  if(sale.paymentStatus===paymentReceived){
   if(includes(sale.receivedDate))totals.received+=amount;
   if(includes(sale.cancelledDate))totals.refunds+=amount;
  }else if(!sale.cancelledDate&&includes(sale.date))totals.receivable+=amount;
 }
 for(const expense of expenses){
  if(expense.expenseStatus===expenseOpen){
   if(includes(expense.date))totals.payable+=moneyCents(expense.value);
  }else if(includes(expense.expensePaidDate||expense.date))totals.paid+=moneyCents(expense.value);
 }
 return {...totals,balance:totals.received-totals.refunds-totals.paid};
}

 const form=document.getElementById('saleForm'), fields=form.elements;

 const refreshCagePicker=()=>{

function saveSale(fields,oldId,linksReviewed=false,pickedCages=[]){
 const old=oldId?getRecord('revenues',oldId):null;
 if(oldId&&(!old||old.cancelledDate))return 'Esta venda já foi cancelada ou não está mais disponível.';
 const bird=fields.kind==='bird',item=getRecord(bird?'birds':'stock',fields.itemId);
 if(!item||(!bird&&!cageProduct(item)))return 'Selecione um item disponível para venda.';
 if(old&&(old.kind!==fields.kind||old.itemId!==item.id))return 'O item da venda já registrada precisa ser mantido.';
 const date=fields.date,received=fields.paymentStatus===paymentReceived;
 if(!validFinanceDate(date))return 'Informe uma data de venda válida.';
 if(![paymentReceived,paymentOpen].includes(fields.paymentStatus))return 'Informe a situação do pagamento.';
 if(received&&(!validFinanceDate(fields.receivedDate)||fields.receivedDate<date))return 'Informe o recebimento na data da venda ou em uma data posterior.';
 const alreadyDelivered=!!physicalSaleDate(old), deliveryDate=physicalSaleDate(old)||fields.deliveryDate||'';
 if(deliveryDate&&(!validFinanceDate(deliveryDate)||deliveryDate<date))return 'Informe a entrega na data da venda ou depois.';
 if(bird&&deliveryDate&&!alreadyDelivered&&!linksReviewed){
  const links=birdExitLinks(item.id);
  if(links.couples||links.tasks)return 'Confira os vínculos antes de registrar a entrega.';
 }
 if(bird&&(item.exit||birdOutside(item.id)&&birdOutside(item.id).id!==oldId))return 'Esta ave ainda não retornou ao plantel.';
 const quantity=fields.quantity,cents=moneyCents(fields.unitPrice)*quantity;
 if(!Number.isSafeInteger(quantity)||quantity<1||!Number.isSafeInteger(cents)||cents<=0)return 'Informe uma quantidade inteira e um valor maior que zero.';
 if(bird&&quantity!==1)return 'Registre uma ave por venda.';
 if(bird&&db.revenues.some(r=>r.kind==='bird'&&r.itemId===item.id&&!r.cancelledDate&&r.id!==oldId))return 'Esta ave já tem uma venda registrada.';
 const available=bird?0:Number(item.quantity)+Number(alreadyDelivered?old.quantity:0);
 const movement=bird||!alreadyDelivered?null:db.movements.find(m=>m.saleId===oldId&&m.stock===item.id&&m.type==='SAÍDA');
 if(!bird&&alreadyDelivered&&!movement)return 'A saída vinculada não foi localizada. Confira o histórico de estoque.';
 if(!bird&&(!Number.isFinite(available)||quantity>available-stockReserved(item.id,oldId)))return 'Estoque insuficiente para esta venda.';
 const previous=JSON.stringify(db), stamp=new Date().toISOString();
 const record={...old,...fields,deliveryDate,id:oldId||id(),itemName:old?.itemName||(bird?birdName(item)+(item.ring&&item.ring!==birdName(item)?' · '+item.ring:''):item.name),
  unitPrice:moneyCents(fields.unitPrice)/100,value:cents/100,receivedDate:received?fields.receivedDate:'',
  acquisitionCost:old?old.acquisitionCost:(bird&&Number(item.acquisitionValue)>0?Number(item.acquisitionValue):null),
  createdAt:old?.createdAt||stamp,updatedAt:stamp};
 if(!bird&&deliveryDate){
  const cageError=syncCageUnits(item)||allocateSaleCages(item,record,alreadyDelivered?old:null,pickedCages);
  if(cageError){db=JSON.parse(previous);return cageError}
  item.quantity=available-quantity;
  const output={stock:item.id,type:'SAÍDA',quantity,date:deliveryDate,notes:'VENDA DE GAIOLA',saleId:record.id,updatedAt:stamp};
  if(movement)Object.assign(movement,output);
  else db.movements.push({id:id(),createdAt:stamp,...output});
  const cageErrorAfter=syncCageUnits(item);
  if(cageErrorAfter){db=JSON.parse(previous);return cageErrorAfter}
 }
 if(old)Object.assign(old,record);else db.revenues.push(record);
 if(persist('revenues',old?'EDITAR VENDA':'REGISTRAR VENDA',record))return '';
 db=JSON.parse(previous);
 return 'Não foi possível gravar a venda. O preenchimento foi preservado.';
}
function returnSoldItem(sale,date){
 if(sale.kind==='cage'){
  const item=getRecord('stock',sale.itemId);
  const movement=db.movements.find(m=>m.saleId===sale.id&&m.stock===sale.itemId&&m.type==='SAÍDA');
  if(!item||!movement||!Number.isFinite(Number(item.quantity)))return 'A saída vinculada não foi localizada. Confira o estoque.';
  const linked=(sale.cageFacilityIds||[]).map(id=>getRecord('facilities',id));
  if(linked.some(unit=>!unit||unit.cageStockId!==item.id||unit.cageSaleId!==sale.id))return 'As gaiolas vinculadas à venda não foram localizadas.';
  for(const unit of linked){delete unit.cageSaleId;unit.cageOffStock=false}
  item.quantity=Number(item.quantity)+Number(sale.quantity);
  db.movements.push({id:id(),stock:item.id,type:'ENTRADA',quantity:sale.quantity,date,
   notes:'DEVOLUÇÃO DE VENDA',saleId:sale.id,createdAt:new Date().toISOString()});
  const cageError=syncCageUnits(item);
  if(cageError)return cageError;
 }
 sale.returnedDate=date;
 sale.returnPending=false;
 return '';
}
function changeSaleReturn(saleId,date,returnNow,returnOnly=false){
 const sale=getRecord('revenues',saleId);
 if(!sale||(returnOnly?!sale.cancelledDate||!sale.returnPending:!!sale.cancelledDate))return 'Esta ação não está mais disponível para a venda.';
 const delivered=physicalSaleDate(sale);
 const minDate=(returnOnly?[sale.cancelledDate,delivered]:[sale.date,sale.receivedDate,delivered]).filter(Boolean).sort().at(-1);
 if(!validFinanceDate(date)||date<minDate)return 'Informe uma data igual ou posterior às datas já registradas nesta venda.';
 const previous=JSON.stringify(db);
 if(returnNow&&delivered){
  const error=returnSoldItem(sale,date);
  if(error){db=JSON.parse(previous);return error}
 }else if(delivered)sale.returnPending=true;
 if(!returnOnly)sale.cancelledDate=date;
 if(persist('revenues',returnOnly?'REGISTRAR DEVOLUÇÃO':'CANCELAR VENDA',sale))return '';
 db=JSON.parse(previous);
 return 'Não foi possível gravar a alteração.';
}
function openSaleCancellation(sale,returnOnly=false){
 const delivered=!!physicalSaleDate(sale);
 modal(returnOnly?'Registrar devolução':'Cancelar venda',`<form id="saleCancelForm">
 <p>${esc(sale.itemName)} · ${brl(sale.value)}</p>
 <p>${returnOnly?'A devolução repõe a quantidade no estoque ou devolve a ave ao plantel ativo.':sale.receivedDate?'O cancelamento registrará o estorno integral na data informada.':'O cancelamento retirará a venda do total a receber.'}</p>
 ${input('cancelledDate',returnOnly?'Data da devolução':sale.receivedDate?'Data do estorno':'Data do cancelamento','date',today(),true)}
 ${!returnOnly&&delivered?select('returnChoice','O item foi devolvido?',['SIM','NÃO'],'',true):''}
 <p class="form-feedback" role="alert" hidden></p>
 <div class="modal-foot"><button type="button" class="btn secondary" data-action="close">Voltar</button><button type="submit" class="btn ${returnOnly?'':'danger'}">${returnOnly?'Salvar devolução':'Confirmar cancelamento'}</button></div></form>`);
 const form=document.getElementById('saleCancelForm');
 form.onsubmit=e=>{
  e.preventDefault();
  const error=changeSaleReturn(sale.id,form.elements.cancelledDate.value,
   returnOnly||form.elements.returnChoice?.value==='SIM',returnOnly);
  if(error)return formFeedback(form,error);
  closeModal();render();toast(returnOnly?'Devolução registrada.':'Venda cancelada.');
 };
}

 query='';

}

 if(!button)return;
 if(button.dataset.openSale)return revealSale(button.dataset.openSale);
 if(button.dataset.saleKind)return openSale(button.dataset.saleKind,button.dataset.saleItem);
 const sale=getRecord('revenues',button.dataset.saleEdit||button.dataset.saleCancel||button.dataset.saleReturn||button.dataset.saleDeliver);
 if(button.dataset.saleReturn&&sale?.returnPending)return openSaleCancellation(sale,true);
 if(!sale||sale.cancelledDate)return;
 if(button.dataset.saleEdit||button.dataset.saleDeliver)openSale(sale.kind,sale.itemId,sale,!!button.dataset.saleDeliver);
 else openSaleCancellation(sale);
});

function makeQuickNest(coupleId,date,stamp,dates){
 const year=date.slice(0,4);
 let season=db.seasons.filter(item=>sameId(item.couple,coupleId)&&item.start&&item.start<=date&&
  (item.end?date<=item.end:item.start.startsWith(year))).sort((a,b)=>b.start.localeCompare(a.start))[0];
 if(!season){
  season={id:id(),name:'TEMPORADA '+year,couple:coupleId,start:year+'-01-01',createdAt:stamp,quickRepro:true};
  db.seasons.push(season);
 }
 const attempt={id:id(),season:season.id,couple:coupleId,start:date,createdAt:stamp,quickRepro:true};
 db.attempts.push(attempt);
 const draft={attempt:attempt.id};
 const species=nestSpecies(draft);
 const timing=newNestTiming(species)||db.settings.reproTiming?.[normalizeSpecies(species)];
 const next={id:id(),...draft,name:'NINHADA '+fmtDate(date),date,createdAt:stamp,quickRepro:true,
  ...(dates||(timing?{timing:{...timing}}:{}))};
 db.nests.push(next);
 return next;
}

}
function finishReproChange(type,action,record,previous){

}
function saveQuickRepro(action,coupleId,nestId,date,amount,result='',dates){
 if(!Object.hasOwn(quickReproActions,action)||!validFinanceDate(date))return 'Informe uma data válida.';
 const couple=getRecord('couples',coupleId);
 if(!couple)return 'O casal não foi encontrado.';
 const closing=action==='close';
 if(!closing&&(birdOutOfPlantel(findBird(couple.male))||birdOutOfPlantel(findBird(couple.female))))return 'Este casal tem uma ave fora do Plantel.';
 if(!closing&&((couple.start&&date<couple.start)||(couple.end&&date>couple.end)))return 'Informe uma data dentro do período do casal.';
 if(!nestId||closing&&nestId==='new')return 'Selecione a ninhada.';
 let nest=nestId==='new'?null:getRecord('nests',nestId);
 if(nestId!=='new'&&(!nest||nest.closedAt||!sameId(lineage('nests',nest).couple?.id,couple.id)))return 'Selecione uma ninhada aberta deste casal.';
 const earlierPosture=action==='eggs'&&nest?.quickRepro&&nest.date&&date<nest.date&&
  !db.eggs.some(egg=>sameId(egg.nest,nest.id));
 const attempt=earlierPosture?getRecord('attempts',nest.attempt):null;
 const season=attempt?getRecord('seasons',attempt.season):null;
 const canBackfill=!!(attempt?.quickRepro&&season?.start<=date&&(!season.end||date<=season.end));
 if(nest?.date&&date<nest.date&&!canBackfill)return 'A data é anterior à abertura da ninhada.';
 if(closing){
  if(!nestResults.includes(result))return 'Escolha o resultado da ninhada.';
  const hasChicks=nestChicks(nest.id).length>0;
  if(hasChicks&&result==='Sem nascimentos')return 'Há filhotes registrados nesta ninhada. Confira o resultado.';
  if(!hasChicks&&result==='Com filhotes')return 'Registre o nascimento dos filhotes antes de encerrar com esse resultado.';
  if(date<nestRecordDate(nest))return 'A data de encerramento deve ser igual ou posterior ao último registro da ninhada.';
 }else if(!Number.isInteger(amount)||amount<1||amount>100)return 'Informe uma quantidade inteira de 1 a 100 por lançamento.';
 const previous=JSON.stringify(db),stamp=new Date().toISOString();
 if(!nest)nest=makeQuickNest(couple.id,date,stamp,dates);
 if(canBackfill){
  nest.date=date;
  if(nest.name==='NINHADA '+fmtDate(attempt.start))nest.name='NINHADA '+fmtDate(date);
  attempt.start=date;
 }
 if(closing){
  Object.assign(nest,{closedAt:date,closeResult:result,updatedAt:stamp});
  return finishReproChange('nests','ENCERRAR NINHADA',nest,previous);
 }
 const existing=action==='eggs'
  ?db.eggs.filter(egg=>sameId(egg.nest,nest.id))
  :nestChicks(nest.id);
 const names=new Set(existing.map(row=>upper(row.name)));
 const prefix=action==='eggs'?'OVO':'FILHOTE';
 let number=1;
 for(let index=0;index<amount;index++){
  while(names.has(prefix+' '+number))number++;
  const name=prefix+' '+number;
  names.add(name);
  db[action].push({id:id(),name,nest:nest.id,date,createdAt:stamp,...(action==='eggs'?{status:'REGISTRADO'}:{couple:couple.id})});
 }
 return finishReproChange(action,action==='eggs'?'REGISTRAR POSTURA':'REGISTRAR NASCIMENTO',nest,previous);
}
function openQuickRepro(action,coupleId,nestId){
 const couple=getRecord('couples',coupleId), closing=action==='close';
 if(!couple||!Object.hasOwn(quickReproActions,action))return;
 const nests=pairNests(coupleId).filter(nest=>!nest.closedAt);
 const selected=nestId||(!nests.length&&!closing?'new':'');
 const choices=[...(closing?[]:[['new','Abrir nova ninhada']]),...byName(nests,nest=>nest.name||'Ninhada').map(nest=>[nest.id,(nest.name||'Ninhada')+' · '+nestSummary(nest)])];
 const help=closing?'O encerramento mantém o histórico e os desfechos registrados de cada ovo.'
  :action==='chicks'?'Se os ovos ainda não foram registrados, o nascimento será salvo com os pais e sem preencher a quantidade de ovos nem a origem individual.'
  :'Informe os ovos desta postura. Selecione uma ninhada aberta para acrescentar ovos ou abra uma nova.';
 modal(quickReproActions[action],`<form id="quickReproForm">
  <p><strong>${esc(pairLabel(couple))}</strong></p><p class="muted">${help}</p>
  <div class="form-grid">
  <div ${!nests.length&&!closing?'hidden':''}><label for="quickNest">Ninhada *</label><select id="quickNest" name="nest" required>
  <option value="">SELECIONE</option>${choices.map(([key,label])=>`<option value="${esc(key)}" ${selected===key?'selected':''}>${esc(label)}</option>`).join('')}
  </select></div>
  ${input('date',closing?'Data do encerramento':action==='eggs'?'Data da postura':'Data do nascimento','date',today(),true)}
  ${closing?select('result','Resultado',nestResults,'',true):input('amount',action==='eggs'?'Quantidade de ovos':'Quantidade de filhotes','number',1,true,'min="1" max="100" step="1"')}
  </div><div class="form-grid" data-new-nest-dates hidden></div>${action==='chicks'?'<div id="quickBirthEggs"></div>':''}<p class="form-feedback" role="alert" hidden></p>
  <div class="modal-foot"><button type="button" class="btn secondary" data-action="close">Cancelar</button>

function mixIngredients(food){
 const lines=String(food?.composition||'').trim().split(/\r?\n/).filter(line=>line.trim());
 const ingredients=lines.map(line=>{
  const row=/^\s*(.+?)\s*:\s*(\d+(?:[,.]\d{1,2})?)\s*%\s*$/.exec(line);
  return row?{name:row[1],parts:Math.round(Number(row[2].replace(',','.'))*100)}:null;
 });
 return ingredients.every(Boolean)&&ingredients.reduce((sum,item)=>sum+item.parts,0)===10000?ingredients:[];
}
function mixWeights(ingredients,grammes){
 const total=Math.round(grammes*100);
 const shares=ingredients.map(({parts})=>Math.floor(total*parts/10000));
 const order=ingredients.map(({parts},index)=>({index,remainder:total*parts%10000})).sort((a,b)=>b.remainder-a.remainder);
 const leftover=total-shares.reduce((sum,value)=>sum+value,0);
 for(const {index} of order.slice(0,leftover))shares[index]++;
 return shares.map(value=>value/100);
}
const mixFormat=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});
function mixCalculator(food){
 const ingredients=mixIngredients(food);
 if(!ingredients.length)return '<p class="helper">Para calcular, preencha a composição com um ingrediente e percentual por linha, como “Alpiste: 45%”. O total deve ser 100%.</p>';
 return `<div data-mix-calculator><div class="toolbar">
 <label>Peso da mistura <select class="field" data-mix-weight><option value="200">200 g</option><option value="500">500 g</option><option value="1000">1 kg</option><option value="custom">Outro peso</option></select></label>
 <label data-mix-custom hidden>Outro peso (g) <input class="field" type="text" inputmode="decimal" data-mix-grams placeholder="Ex.: 750" aria-label="Outro peso em gramas"></label>
 </div><div data-mix-result aria-live="polite">${mixList(ingredients,200)}</div></div>`;
}
function mixList(ingredients,grams){
 if(!Number.isFinite(grams)||grams<=0||!Number.isSafeInteger(Math.round(grams*100)*10000))return '<p>Informe um peso válido em gramas.</p>';
 const amounts=mixWeights(ingredients,grams);
 return `<dl class="mix-amounts">${ingredients.map(({name,parts},i)=>`<div><dt>${esc(name)} <small>(${mixFormat.format(parts/100)}%)</small></dt><dd>${mixFormat.format(amounts[i])} g</dd></div>`).join('')}
 <div><dt><strong>Total</strong></dt><dd>${mixFormat.format(grams)} g</dd></div></dl>`;
}

function cageUnits(stockId){
 return db.facilities.filter(f=>f.cageStockId===stockId);
}
function cageInUse(unit,date=today()){
 return db.transfers.some(t=>sameId(t.facility,unit.id)&&(!t.end||t.end>date));
}
function cageUnavailable(unit){
 return !!(unit.cageRetired||unit.cageOffStock||unit.cageSaleId);
}

 return db.transfers.filter(t=>sameId(t.facility,unit.id)&&(!t.start||t.start<=today())&&(!t.end||t.end>today()));

function syncCageUnits(item){
 if(!item||!cageProduct(item))return '';
 const capacity=Number(item.quantity);
 if(!Number.isSafeInteger(capacity)||capacity<0)return 'Confira o saldo inteiro de gaiolas no Estoque.';
 const movements=db.movements.filter(m=>m.stock===item.id);
 const opening=capacity-movements.reduce((sum,m)=>sum+(m.type==='ENTRADA'?1:-1)*Number(m.quantity),0);
 const sources=new Map([['stock:'+item.id,Math.max(0,opening)]]);
 for(const move of movements)if(move.type==='ENTRADA'&&!move.saleId)sources.set('movement:'+move.id,Number(move.quantity));
 const units=cageUnits(item.id);
 for(const unit of units)if(!sources.has(unit.cageOrigin))sources.set(unit.cageOrigin,0);
 const titles=new Set(db.facilities.map(f=>upper(f.name)));
 let index=1;
 const occupied=unit=>cageInUse(unit);
 const protectedUnit=unit=>Boolean(unit.cageSaleId)||occupied(unit);
 for(const [source,total] of sources){
  if(!Number.isSafeInteger(total)||total<0)return 'Confira as quantidades nas entradas de gaiolas.';
  const batch=units.filter(unit=>unit.cageOrigin===source)
   .sort((a,b)=>Number(protectedUnit(b))-Number(protectedUnit(a))||Number(!!b.cageManualLink)-Number(!!a.cageManualLink)||Number(!!a.cageRetired)-Number(!!b.cageRetired));
  if(batch.filter(protectedUnit).length>total)return 'A quantidade da entrada não pode ficar abaixo das gaiolas ocupadas ou já entregues dessa entrada.';
  batch.forEach((unit,i)=>{unit.cageRetired=i>=total;});
  for(let i=batch.length;i<total;i++){
   while(titles.has(upper(item.name)+' '+index))index++;
   const name=upper(item.name)+' '+index++;
   titles.add(name);
   const unit={id:id(),name,type:'GAIOLA',cageStockId:item.id,cageOrigin:source,createdAt:new Date().toISOString()};
   units.push(unit);db.facilities.push(unit);
  }
 }
 const candidates=units.filter(unit=>!unit.cageRetired&&!unit.cageSaleId)
  .sort((a,b)=>Number(occupied(b))-Number(occupied(a))||Number(!!a.cageOffStock)-Number(!!b.cageOffStock));
 if(candidates.filter(occupied).length>capacity)return 'Libere as gaiolas ocupadas ou reservadas em Instalações antes de baixar esse saldo.';
 if(candidates.length<capacity)return 'O saldo de gaiolas não corresponde às entradas registradas.';
 candidates.forEach((unit,i)=>{unit.cageOffStock=i>=capacity});
 return '';
}
function reconcileCageChanges(type,record,old){
 const items=type==='stock'?[record.id]:type==='movements'?[old?.stock,record.stock]:[];
 for(const itemId of new Set(items.filter(Boolean))){
  const error=syncCageUnits(getRecord('stock',itemId));
  if(error)return error;
 }
 return '';
}
function allocateSaleCages(item,record,old,pickedCages){
 const prevIds=old?.cageFacilityIds||[];
 if(prevIds.some(unitId=>!cageUnits(item.id).some(unit=>unit.id===unitId&&unit.cageSaleId===record.id)))return 'As gaiolas vinculadas à venda não foram localizadas.';
 const unidentified=Math.min(Number(old?.cageUnidentifiedQuantity??(old&&!old.cageFacilityIds?old.quantity:0)),record.quantity);
 const wanted=record.quantity-unidentified;
 const current=prevIds.slice(0,wanted);
 const available=cageUnits(item.id).filter(unit=>!cageUnavailable(unit)&&!cageInUse(unit,record.deliveryDate));
 const extra=wanted-current.length;
 const chosen=pickedCages.length?available.filter(unit=>pickedCages.includes(unit.id)):available.slice(0,extra);
 if(pickedCages.length&&(chosen.length!==extra||chosen.length!==pickedCages.length))return 'Confira se a seleção contém uma gaiola livre para cada unidade vendida.';
 if(extra>chosen.length)return 'Não há gaiolas livres suficientes. Encerre a ocupação em Instalações antes da entrega.';
 for(const unitId of prevIds.slice(wanted))delete getRecord('facilities',unitId).cageSaleId;
 for(const unit of chosen){unit.cageSaleId=record.id;current.push(unit.id)}
 record.cageFacilityIds=current;
 record.cageUnidentifiedQuantity=unidentified;
 return '';
}

 if(!unit||unit.cageStockId||upper(unit.type)!=='GAIOLA'||!cageProduct(item))return 'Selecione uma gaiola e um produto disponíveis.';

 return '';
}

function stockAcquisitionQuantity(record){
 if(record.acquisitionQuantity!==undefined&&record.acquisitionQuantity!==null&&record.acquisitionQuantity!=='')return Number(record.acquisitionQuantity);
 const movementNet=db.movements.filter(m=>sameId(m.stock,record.id)).reduce((sum,m)=>
  sum+(m.type==='ENTRADA'?1:-1)*Number(m.quantity||0),0);
 const inferred=Number((Number(record.quantity)-movementNet).toFixed(8));
 return Number.isFinite(inferred)&&inferred>0?inferred:null;
}
function stockExpenseValue(type,record){
 if(type==='movements'&&record.type!=='ENTRADA')return 0;
 const quantity=type==='stock'?stockAcquisitionQuantity(record):Number(record.quantity);
 const total=Number(record.cost)||Number(record.unitCost)*quantity;
 const cents=Math.round((total+Number.EPSILON)*100);
 return Number.isSafeInteger(cents)&&cents>0?cents/100:0;
}
function stockExpenseKey(date,value){return JSON.stringify([date,Math.round(Number(value)*100)])}
function stockExpenseCandidates(){
 const manualKeys=new Set(db.expenses.filter(e=>!e.birdAcquisitionId).map(e=>stockExpenseKey(e.date,e.value)));
 const result=[];
 for(const [type,records] of [['stock',db.stock],['movements',db.movements]]){
  for(const record of records){
   const value=stockExpenseValue(type,record);
   if(!value)continue;
   const product=type==='stock'?record:getRecord('stock',record.stock);
   const possibleDuplicate=!record.stockExpenseConfirmed&&manualKeys.has(stockExpenseKey(record.date,value));
   const date=String(record.date||'');
   const parsed=new Date(date+'T00:00:00Z');
   const validDate=/^\d{4}-\d{2}-\d{2}$/.test(date)&&!Number.isNaN(parsed.getTime())&&parsed.toISOString().slice(0,10)===date;
   const review=!validDate?'Informe a data da aquisição.':possibleDuplicate?'Há uma despesa manual na mesma data e com o mesmo valor. Confira antes de incluir.':'';
   const category=upper(product?.category);
   result.push({
    id:`estoque:${type}:${record.id}`,stockOrigin:type,stockOriginId:record.id,
    description:product?.name||'PRODUTO NÃO LOCALIZADO',date,value,
    expenseStatus:record.expenseStatus,expensePaidDate:record.expensePaidDate,
    category:category===cageCategory?cageCategory:category===grainStockCategory?'ALIMENTAÇÃO — SEMENTES':category===produceStockCategory?'ALIMENTAÇÃO — LEGUMES, INFLORESCÊNCIAS E FRUTAS':'OUTROS',
    quantity:type==='stock'?stockAcquisitionQuantity(record):Number(record.quantity),unit:product?.unit||'',
    review
   });
  }
 }
 return result;
}

function stockProducts(category,record){
 const list=[...(stockCatalog.get(category)?.keys()||[])];
 if(record?.name&&upper(record.category)===upper(category)&&!list.includes(upper(record.name)))list.push(upper(record.name));
 return list.sort(compareNames);
}
function stockDecimal(value){
 const text=String(value??'').trim();
 if(!text)return 0;
 if(!/^\d+(?:[.,]\d+)?$/.test(text))return NaN;
 return Number(text.replace(',','.'));
}

function prepareStockSave(type,record,old,form){
 if(type==='stock'&&!old){
  if(!record.unit)return 'SELECIONE A UNIDADE.';
  if(!(record.acquisitionQuantity>0))return 'Informe uma quantidade adquirida maior que zero.';
  // The existing balance is only a preview. This stock row represents the new entry.
  record.quantity=record.acquisitionQuantity;
 }
 for(const key of ['quantity','acquisitionQuantity','cost','unitCost']){
  if(form.elements[key]?.dataset?.stockDecimal&&!Number.isFinite(record[key])&&!form.elements[key].disabled)return 'Informe um valor numérico válido.';
 }
 if(form.elements.cost.dataset.stockCalculated)record.cost=0;
 if(type==='movements'&&!(record.quantity>0))return 'Informe uma quantidade maior que zero.';
 if(type==='stock'){
  if(!stockProducts(record.category,old).includes(record.name))return 'SELECIONE UM PRODUTO DA CATEGORIA.';
  if(!old&&!stockCatalog.has(record.category))return 'SELECIONE A CATEGORIA.';
  if(record.category===accessoryCategory)record.unit='UN';
  if(cageProduct(record)){
   if(!Number.isSafeInteger(record.quantity))return 'Informe a quantidade de gaiolas em unidades inteiras.';
   if(old&&record.quantity<stockReserved(old.id))return 'O saldo não pode ficar abaixo das unidades reservadas para entrega.';
   record.unit='UN';
  }
  if(old&&!cageProduct(record)&&(cageUnits(old.id).length||db.revenues.some(r=>r.kind==='cage'&&r.itemId===old.id)))return 'Mantenha a categoria Gaiolas para preservar o histórico de vendas.';
  if(old&&upper(old.category)===record.category&&upper(old.name)===record.name){
   record.category=old.category;
   record.name=old.name;
  }
  if(form.elements.acquisitionQuantity.value===''){
   record.acquisitionQuantity=old?stockAcquisitionQuantity(old):record.quantity;
  }
 }
 if(type==='movements'&&cageProduct(getRecord('stock',record.stock))&&!Number.isSafeInteger(record.quantity))return 'Informe a quantidade de gaiolas em unidades inteiras.';
 if(type==='movements'&&!['ENTRADA','SAÍDA'].includes(record.type))return 'SELECIONE O TIPO DE MOVIMENTAÇÃO.';
 if(type==='movements'&&record.type==='SAÍDA'){
  record.cost=0;
  record.unitCost=0;
 }
 if(record.cost>0||record.unitCost>0){
  if(!record.date)return 'INFORME A DATA DA AQUISIÇÃO PARA REGISTRAR A DESPESA.';
  if(record.unitCost>0&&!record.cost&&!(Number(type==='stock'?record.acquisitionQuantity:record.quantity)>0)){
   return 'INFORME A QUANTIDADE ADQUIRIDA PARA CALCULAR O TOTAL.';
  }
  if(!stockExpenseValue(type,record))return 'INFORME UM CUSTO TOTAL VÁLIDO DE PELO MENOS R$ 0,01.';
 }
 const key=stockExpenseKey(record.date,stockExpenseValue(type,record));
 const samePurchase=old&&stockExpenseKey(old.date,stockExpenseValue(type,old))===key;
 const manualMatch=db.expenses.some(e=>!e.birdAcquisitionId&&stockExpenseKey(e.date,e.value)===key);
 record.stockExpenseConfirmed=samePurchase&&old.stockExpenseConfirmed===true
  ||samePurchase&&form.elements.stockExpenseConfirmed?.checked===true
  ||!manualMatch;
 return '';
}

function validate(type,r,current,pendingParents=[]){if(type==='birds'){if(!r.scientific.trim())return 'O NOME CIENTÍFICO É OBRIGATÓRIO.';if(r.ring&&db.birds.some(b=>b.id!==current&&upper(b.ring)===upper(r.ring)))return 'ESSA ANILHA JÁ ESTÁ CADASTRADA.';if(current&&(r.father===current||r.mother===current))return 'A AVE NÃO PODE SER SEU PRÓPRIO PAI OU MÃE.';if(r.father&&sexValue(findAncestor(r.father,pendingParents)?.sex)!=='MACHO')return parentError(r.father,'PAI','MACHO');if(r.mother&&sexValue(findAncestor(r.mother,pendingParents)?.sex)!=='FÊMEA')return parentError(r.mother,'MÃE','FÊMEA');const candidates=[...ancestryBirds().filter(b=>!sameId(b.id,r.id)),...pendingParents,r];if(checkCycle(r.id||current,r.father,candidates)||checkCycle(r.id||current,r.mother,candidates))return 'VÍNCULO GENEALÓGICO CIRCULAR NÃO PERMITIDO.'}

if(type==='movements'){const s=db.stock.find(s=>s.id===r.stock);if(!s)return 'SELECIONE UM PRODUTO.';const previous=db.movements.find(x=>x.id===current);const reversed=previous&&previous.stock===r.stock?(previous.type==='ENTRADA'?-Number(previous.quantity):Number(previous.quantity)):0;const delta=r.type==='ENTRADA'?Number(r.quantity):-Number(r.quantity);if(Number(s.quantity)+reversed+delta<stockReserved(s.id))return 'SALDO DISPONÍVEL INSUFICIENTE PARA ESTA MOVIMENTAÇÃO.';if(previous&&previous.stock!==r.stock){const p=db.stock.find(x=>x.id===previous.stock);if(p&&Number(p.quantity)+(previous.type==='ENTRADA'?-Number(previous.quantity):Number(previous.quantity))<stockReserved(p.id))return 'A TRANSFERÊNCIA DE MOVIMENTAÇÃO GERARIA SALDO NEGATIVO NO PRODUTO ANTERIOR.'}}

function routineDates(start,days,end){

 const next=[digits.slice(0,2),digits.slice(2,4),digits.slice(4)].filter(Boolean).join('/');
 if(next!==field.value){
  field.value=next;

commitImport=function(){const before=JSON.stringify(db);let added=0,duplicates=0,review=0;const errors=[];for(const check of document.querySelectorAll('[data-import-row]:checked')){const i=Number(check.dataset.importRow),r={};document.querySelectorAll('[data-row="'+i+'"]').forEach(el=>r[el.dataset.importKey]=el.value.trim());const birth=parseBRDate(r.birthDate||'');if(!r.scientific||!r.ring||birth===null){review++;errors.push('Linha '+(i+1)+': confira espécie, código e nascimento.');continue}const sx=sexValue(r.sex);if(r.sex&&sx==='NÃO IDENTIFICADO'&&!['NÃO IDENTIFICADO','DESCONHECIDO'].includes(upper(r.sex))){review++;errors.push('Linha '+(i+1)+': sexo incerto.');continue}if(db.birds.some(b=>upper(b.ring||'').replace(/\s/g,'')===upper(r.ring).replace(/\s/g,''))){duplicates++;continue}if([['status',db.settings.statuses],['condition',db.settings.conditions]].some(([k,list])=>r[k]&&!list.some(x=>upper(x)===upper(r[k])))){review++;errors.push('Linha '+(i+1)+': situação ou condição não cadastrada.');continue}db.birds.push({...r,birthDate:birth,sex:sx,father:'',mother:'',id:id(),createdAt:new Date().toISOString(),importSource:'PDF revisado',sourceMetadata:{commonName:importRows[i]?.commonName||'',reviewedAt:new Date().toISOString()}});added++}if(added&&!persist('birds','IMPORTAR PDF',{count:added})){db=JSON.parse(before);return document.getElementById('importResult').textContent='Falha ao salvar. Nenhum registro mantido.'}render();document.getElementById('importResult').textContent=`Importadas: ${added}. Já cadastradas: ${duplicates}. Revisão: ${review}. ${errors.join(' ')}`};
function normalized(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function structuredBirdRows(words){const lines=[];for(const w of words.slice().sort((a,b)=>a.y-b.y||a.x-b.x)){let l=lines.find(l=>Math.abs(l.y-(w.y+w.h/2))<Math.max(6,w.h*.55));if(!l){l={y:w.y+w.h/2,items:[]};lines.push(l)}l.items.push(w)}let columns=null;const result=[];for(const l of lines){l.items.sort((a,b)=>a.x-b.x);const txt=normalized(l.items.map(x=>x.text).join(' '));if(txt.includes('sexo')&&txt.includes('nascimento')){const specs=[['scientific','cient'],['commonName','comum'],['sex','sexo'],['birthDate','nascimento'],['ringType','tipo'],['ringDiameter','diam'],['ring','digo']];columns=specs.map(([key,token])=>{const index=l.items.findIndex(w=>normalized(w.text).includes(token));if(index<0)return null;const word=l.items[index];return {key,x:word.x,right:word.x+word.w}});if(columns.some(x=>!x)){columns=null;continue}columns.forEach((c,i)=>c.left=i?(columns[i-1].right+c.x)/2:-Infinity);continue}if(!columns)continue;if(/aten[cç]|observa/.test(txt))break;const cells={};for(const w of l.items){const c=columns.slice().reverse().find(c=>w.x+w.w/2>=c.left);if(c)cells[c.key]=(cells[c.key]?cells[c.key]+' ':'')+w.text}if(cells.scientific)cells.scientific=cells.scientific.replace(/^\d+\s+/,'');if(cells.scientific&&/^[A-Za-z]+\s+[a-z]+/.test(cells.scientific)&&cells.ring&&(/\d{2}\/\d{2}\/\d{4}/.test(cells.birthDate||'')||/anilha/i.test(cells.ringType||''))){cells.birthDate=parseBRDate((cells.birthDate||'').replace(/\s/g,''))||'';const sex=sexValue(cells.sex);cells.review=sex==='NÃO IDENTIFICADO'?'Sexo não reconhecido; confira a imagem.':'Conferir OCR antes de salvar.';cells.sex=sex==='NÃO IDENTIFICADO'?'':sex;result.push(cells)}}return result}
parseIbamaRows=function(text){const result=[];const lines=text.split(/\r?\n/);for(let i=0;i<lines.length;i++){let line=lines[i].replace(/\|/g,' ').trim();if(!/^(?:\d+\s+)?[A-Z][a-z]+\s+[a-z]+\b/.test(line))continue;while(i+1<lines.length&&/^\s*[\d.,]+(?:\s+\d+)?\s*$/.test(lines[i+1]))line+=' '+lines[++i].trim();const m=line.match(/^(?:\d+\s+)?([A-Z][a-z]+\s+[a-z]+)\s+(.*?)\s+([^\s]+)\s+(\d{2}\/\d{2}\/\d{4})\s+(anilha\s*(?:fechada|aberta))\s*(.*)$/i);if(!m)continue;let tail=m[6].trim(),diam='';const dm=tail.match(/^([\d.,]+)\s+/);if(dm){diam=dm[1];tail=tail.slice(dm[0].length)}if(!tail)continue;const sx=sexValue(m[3]);result.push({scientific:m[1],commonName:m[2],sex:sx==='NÃO IDENTIFICADO'?'':sx,birthDate:parseBRDate(m[4])||'',ringType:m[5].replace(/^anilha\s*/i,'anilha '),ringDiameter:diam,ring:tail,review:sx==='NÃO IDENTIFICADO'?'Sexo incerto: '+m[3]+'. Confira também o diâmetro.':'Conferir espécie e código de anilha.'})}return result};
readBirdPDF=async function(file){if(!file)return;const status=document.getElementById('pdfProgress');try{status.textContent='Lendo documento…';await loadLib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',()=>window.pdfjsLib);pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let rows=[],raw='';for(let n=1;n<=pdf.numPages;n++){status.textContent=`Analisando página ${n}/${pdf.numPages}…`;const page=await pdf.getPage(n),tc=await page.getTextContent(),text=tc.items.map(x=>x.str).join(' ');let words,pageText;if(unusablePDFText(text)){await loadLib('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',()=>window.Tesseract);const vp=page.getViewport({scale:3}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;status.textContent=`Reconhecendo colunas por OCR: página ${n}…`;const ocr=await Tesseract.recognize(canvas,'por');pageText=ocr.data.text;words=(ocr.data.words||[]).map(w=>({text:w.text,x:w.bbox.x0,y:w.bbox.y0,w:w.bbox.x1-w.bbox.x0,h:w.bbox.y1-w.bbox.y0}))}else{pageText=text;words=tc.items.map(x=>({text:x.str,x:x.transform[4],y:-x.transform[5],w:x.width,h:x.height||10}))}let found=structuredBirdRows(words);if(!found.length)found=parseIbamaRows(pageText);rows.push(...found);raw+=pageText+'\n'}if(rows.length){showBirdPreview(rows);status.textContent=`${rows.length} ave(s) identificada(s). Confira e confirme para salvar.`}else{status.textContent='Não foi possível identificar com segurança as colunas. Cole uma ave por linha abaixo, separando os campos por |.';document.getElementById('pdfReview').innerHTML='<p>Ordem: nome científico | nome individual | sexo | nascimento | tipo de anilha | diâmetro | código de anilha | situação | condição</p><textarea id="pdfText" style="width:100%;min-hei // Uma linha por série; registros sem série permanecem individuais.
function unusedRoutineDates(template,dates){
 const signature=task=>JSON.stringify([task.name,task.date,[...birdIds(task.bird)].sort()]);
 const known=new Set(db.tasks.filter(task=>task.status!=='CANCELADA'||task.seriesId===template.seriesId).map(signature));
 return dates.filter(date=>!known.has(signature({...template,date})));
}
function routineExtension(group){
 const first=group[0],last=group.at(-1);
 if(!first.seriesId||!Number.isSafeInteger(first.intervalDays)||first.intervalDays<1)return null;
 const start=first.seriesStart||first.date;
 const days=first.intervalDays;
 const existingEnd=group.reduce((end,task)=>task.seriesEnd>end?task.seriesEnd:end,'');
 const today=new Date().toLocaleDateString('en-CA',{timeZone:db.settings.timezone||'America/Fortaleza'});
 const after=existingEnd>last.date?existingEnd:last.date;
 const limit=routineEnd(start,5);
 if(!limit||after>=limit||today>=limit)return null;
 const dates=routineDates(start,days,limit)
  .filter(date=>date>last.date&&date>=after&&date>=today);
 const eligible=unusedRoutineDates(last,dates);
 const years=routineYears.filter(year=>{
  const end=routineEnd(start,year);
  return end>after&&eligible.some(date=>date<end);
 });
 return years.length?{start,last,eligible,years}:null;
}

 modal('Prorrogar rotina',`<form id="routineExtensionForm">
  <p>Duração total a partir de ${fmtDate(start)}. Última ocorrência cadastrada: ${fmtDate(last.date)}.</p>
  <label for="extensionYears">Nova duração total</label>
  <select id="extensionYears" name="extensionYears">${routineYearOptions(years)}</select>

  <button type="submit" class="btn">Prorrogar rotina</button>
 </form>`);
 const form=document.getElementById('routineExtensionForm');

  const end=routineEnd(start,Number(form.elements.extensionYears.value));
  return {end,dates:eligible.filter(date=>date<end)};
 };
 const describe=()=>{
  const {dates}=selection();
  form.querySelector('#extensionSummary').textContent=dates.length?
   `${dates.length} novas ocorrências de ${fmtDate(dates[0])} até ${fmtDate(dates.at(-1))}.`:'Nenhuma nova ocorrência disponível.';
 };
 form.addEventListener('change',describe);

 form.addEventListener('submit',event=>{
  event.preventDefault();

  const year=Number(form.elements.extensionYears.value);

   seriesEnd:end,status:'PENDENTE',createdAt:stamp,updatedAt:stamp})));

   db=JSON.parse(before);
   return toast('Não foi possível salvar a prorrogação.');
  }
  closeModal();render();toast('Rotina prorrogada.');
 });
}

abel="Remover ${esc(x.common)}">×</button></span>`).join(''):'<p class="muted">Nenhuma espécie selecionada.</p>'}</div></div><div class="species-unknown"><button class="btn secondary small" data-species-unknown="toggle" type="button">Não encontrei a espécie</button><div id="speciesUnknownFields" hidden style="margin-top:10px"><p class="muted">Cadastro provisório para revisão taxonômica, não validado pelo catálogo.</p><div class="setup-grid"><div><label for="newSpeciesCommon">Nome comum</label><input class="field" id="newSpeciesCommon" style="width:100%"></div><div><label for="newSpeciesScientific">Nome científico informado</label><input class="field" id="newSpeciesScientific" style="width:100%"></div></div><button class="btn small" data-species-add-custom="1" type="button" style="margin-top:8px">Adicionar para revisão</button></div></div><div style="margin-top:15px"><h3>Espécie de destaque</h3><p class="muted">${selected.length>1?'Escolha uma espécie para o banner inicial.':'Com apenas uma espécie, ela será destacada automaticamente.'}</p><div id="speciesHighlightChoices">${selected.map(s=>`<label class="species-highlight"><input type="radio" name="featuredSpecies" value="${esc(s.id)}" ${speciesDraft.featured===s.id?'checked':''} ${selected.length===1?'disabled':''}><span>${esc(s.common)} — <i>${esc(s.scientific)}</i></span></label>`).join('')}</div></div><div id="speciesPreview">${renderSpeciesPreview()}</div></section></div><div class="notice info">Os créditos das fotografias do catálogo estão em Configurações. Quando a fotografia estiver indisponível, aparece uma ilustração neutra. O catálogo não certifica a regularidade da criação. Fontes: diagnóstico IBAMA/SisPass e Lista das Aves do Brasil (CBRO). Consulta em 12/11/2026.</div>${renderExistingBirdSuggestions()}<div class="setup-bottom"><div class="backup-import-card"><h3>Já possui um backup do Canto &amp; Ninho?</h3><p>Importe um arquivo JSON de um dispositivo anterior antes de concluir a configuração inicial. Nada será substituído antes da sua confirmação.</p><button class="btn secondary" type="button" data-backup-choose="1">↑ Importar backup existente</button></div><div class="setup-error" id="speciesError" role="alert"></div><div class="actions"><button type="button" class="btn secondary" data-species-cancel="1">Voltar ao início</button><button type="button" class="btn" data-species-save="1">${speciesDraft.edit?'Salvar alterações':'Salvar e começar'}</button></div></div></div></div></div>`;
 document.getElementById('welcomeRoot').innerHTML=body;

function renderSpeciesResults(){return speciesOptions().map(s=>`<button class="species-option ${speciesDraft.selected.includes(s.id)?'selected':''}" data-species-toggle="${esc(s.id)}" type="button"><span class="tick">${speciesDraft.selected.includes(s.id)?'✓':'+'}</span>${speciesPhotoImg(s,'species-thumb',customSpeciesPhoto(s))}<span><strong>${esc(s.common)}</strong> — <i>${esc(s.scientific)}</i>${s.review?'<small> · EM REVISÃO</small>':''}</span></button>`).join('')||'<p class="muted" style="padding:10px">Nenhuma correspondência. Use “Não encontrei a espécie”.</p>'}

function toggleSpecies(key){if(!speciesDraft)return;const i=speciesDraft.selected.indexOf(key);if(i>=0){speciesDraft.selected.splice(i,1);if(speciesDraft.featured===key)speciesDraft.featured=''}else if(selectedEntry(key))speciesDraft.selected.push(key);if(speciesDraft.selected.length===1)speciesDraft.featured=speciesDraft.selected[0];renderSpeciesSetup()}
function saveSpeciesSetup(){if(!speciesDraft)return;const selected=[...new Set(speciesDraft.selected)].filter(x=>selectedEntry(x));const error=document.getElementById('speciesError');if(!selected.length){error.textContent='Selecione pelo menos uma espécie.';return}if(selected.length===1)speciesDraft.featured=selected[0];if(!selected.includes(speciesDraft.featured)){error.textContent='Escolha uma espécie de destaque entre as selecionadas.';return}const email=speciesDraft.profile.email.trim();if(email&& !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){error.textContent='Confira o e-mail informado ou deixe o campo vazio.';return}
 const oldSettings=structuredClone(db.settings);Object.assign(db.settings,{...speciesDraft.profile,name:speciesDraft.profile.name.trim()?upper(speciesDraft.profile.name):oldSettings.name||'MEU CRIADOURO',owner:upper(speciesDraft.profile.owner),municipality:upper(speciesDraft.profile.municipality),state:upper(speciesDraft.profile.state),environmentalRegistration:upper(speciesDraft.profile.environmentalRegistration),ctf:speciesDraft.profile.ctf.trim(),speciesSelected:selected,speciesFeatured:speciesDraft.featured,speciesCustom:speciesDraft.custom,setupComplete:true,setupSavedAt:new Date().toISOString()});if(!save()){db.settings=oldSettings;error.textContent='Não foi possível salvar neste dispositivo. Faça backup e libere espaço.';return}speciesDraft=null;document.getElementById('welcomeRoot').innerHTML='';persist('settings','CONFIGURAÇÃO DAS ESPÉCIES',{});nav();render();toast('CONFIGURAÇÃO DO CRIADOURO SALVA.') }

function openPhotoEditor(kind,key){
 const bird=kind==='bird'?findBird(key):null;
 const species=bird?matchedBirdSpecies(bird):speciesById(key);
 if(kind==='bird'?!bird:!species)return;
 const openedDB=db;
 const current=bird?photoData(bird.photo):customSpeciesPhoto(species);
 const fallback=bird?customSpeciesPhoto(species):'';
 modal('Foto de '+(bird?birdName(bird):species.common),`<form id="photoEditor">
  ${speciesPhotoImg(species,'photo-editor-preview',current||fallback,'eager','photoEditorPreview')}
  <label for="photoEditorFile">Escolher imagem (JPG, PNG ou WebP)</label>
  <input class="field photo-editor-file" id="photoEditorFile" type="file" accept="image/jpeg,image/png,image/webp" required>
  <p class="helper" id="photoEditorError" role="alert"></p>
  <div class="modal-foot">
   ${current?`<button type="button" class="btn secondary" id="restorePhoto">${bird?'Usar foto da espécie':'Restaurar foto padrão'}</button>`:''}
   <button type="submit" class="btn">Salvar foto</button>
  </div></form>`);
 const form=document.getElementById('photoEditor');
 const fileInput=document.getElementById('photoEditorFile');
 const error=document.getElementById('photoEditorError');
 const preview=document.getElementById('photoEditorPreview');
 const submit=form.querySelector('button[type=submit]');
 const restore=document.getElementById('restorePhoto');
 let selected='', pending=false;
 fileInput.onchange=async()=>{
  const file=fileInput.files[0];
  selected='';
  pending=!!file;
  submit.disabled=true;
  if(restore)restore.disabled=pending;
  error.textContent='';
  preview.removeAttribute('data-photo-fallback');
  preview.src=current||fallback||speciesPhoto(species)?.url||NEUTRAL_BIRD_IMAGE;
  if(!file)return;
  try{
   const data=await preparePhoto(file);
   if(fileInput.files[0]!==file||!form.isConnected)return;
   selected=data;
   preview.removeAttribute('data-photo-fallback');
   preview.src=data;
   preview.alt='Prévia da foto escolhida';
  }catch(err){
   if(fileInput.files[0]===file&&form.isConnected)error.textContent=err.message;
  }finally{
   if(fileInput.files[0]===file&&form.isConnected){
    pending=false;
    submit.disabled=!selected;
    if(restore)restore.disabled=false;
   }
  }
 };
 form.onsubmit=e=>{
  e.preventDefault();
  if(!pending&&selected)apply(selected);
 };
 if(restore)restore.onclick=()=>apply('');
 function apply(data){
  if(db!==openedDB){error.textContent='Os registros foram recarregados. Feche esta janela e tente novamente.';return}
  savePhoto(kind,key,current,data,error);
 }

async function preparePhoto(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Escolha uma imagem JPG, PNG ou WebP.');
 let image;
 try{image=await createImageBitmap(file)}catch{throw Error('Não foi possível abrir essa imagem. Escolha outro arquivo.')}
 try{
  const canvas=document.createElement('canvas');
  const longest=Math.max(image.width,image.height);
  for(const side of [720,540,360,240]){
   const scale=Math.min(1,side/longest);
   canvas.width=Math.max(1,Math.round(image.width*scale));
   canvas.height=Math.max(1,Math.round(image.height*scale));
   canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL('image/webp',0.8);
   if(data.length<=75000&&photoData(data))return data;
  }
  throw Error('Não foi possível reduzir a imagem. Escolha um arquivo menor.');
 }finally{image.close()}
}

function syncLocalDatabase(){
 if(!storageHandle)storageHandle=new Promise((resolve,reject)=>{
  if(!globalThis.indexedDB)return reject(Error('IndexedDB indisponível'));
  const request=indexedDB.open('canto_ninho_local'+(activeAccount==='owner'?'':'_'+activeAccount),2);
  request.onupgradeneeded=()=>{
   const database=request.result;
   if(!database.objectStoreNames.contains('sync'))database.createObjectStore('sync');
   if(!database.objectStoreNames.contains('records'))database.createObjectStore('records',{keyPath:['collection','id']});
  };
  request.onsuccess=()=>{request.result.onversionchange=()=>request.result.close();resolve(request.result)};
  request.onerror=request.onblocked=()=>reject(request.error||Error('Armazenamento ocupado'));
 }).catch(()=>null);

}
async function syncLocalValue(key,value){

   const table=transaction.objectStore('sync');

   transaction.oncomplete=()=>resolve(writing?true:request.result);
   transaction.onerror=transaction.onabort=()=>resolve(undefined);
  }catch(error){resolve(undefined)}

}
function mirrorRecords(database,next,meta,pending,token){
 return new Promise(resolve=>{
  try{
   const tx=database.transaction(['sync','records'],'readwrite');
   const store=tx.objectStore('records');
   const previous=mirroredData||{};
   if(!mirroredData)store.clear();
   for(const change of syncCore.differences(previous,next)){
    if(change.collection==='settings')continue;
    if(change.value===null)store.delete([change.collection,change.id]);
    else store.put(change);
   }
   const auditIds=new Set(next.audit.map(row=>row.id));
   for(const row of previous.audit||[]){
    if(!auditIds.has(row.id))store.delete(['audit',row.id]);
   }
   const order=Object.fromEntries(syncCore.collections.map(name=>[name,(next[name]||[]).map(row=>row.id)]));
   const extra=Object.fromEntries(Object.entries(next).filter(([key])=>
    !['version','settings',...syncCore.collections].includes(key)));
   tx.objectStore('sync').put({version:next.version,settings:next.settings,order,extra,meta,pending,token},'working');
   tx.oncomplete=()=>resolve(true);
   tx.onerror=tx.onabort=()=>resolve(false);
  }catch(error){resolve(false)}
 });
}

 const pending=syncBase&&meta?.dirty&&syncBase.revision===meta.revision
  ? syncCore.differences(syncBase.data,snapshot) : null;
 mirrorWrites=mirrorWrites.then(async()=>{
  const database=await syncLocalDatabase();
  if(!database||!localCopyCurrent()||localRevision!==revision)return;
  localMirrorInFlight=true;
  try{
   if(!await mirrorRecords(database,snapshot,meta,pending,journal?.token))return;
   mirroredData=snapshot;
  }finally{localMirrorInFlight=false;}
  if(journal&&localCopyCurrent()&&localRevision===revision){
   const checkpoint=JSON.stringify({token:journal.token});
   try{localStorage.setItem(LOCAL_JOURNAL_KEY,checkpoint);localRevision=checkpoint;}
   catch(error){console.warn('O diário local foi preservado',error.name);}
  }

async function readWorkingData(){
 const database=await syncLocalDatabase();
 if(!database)return null;
 return new Promise(resolve=>{
  try{
   const tx=database.transaction(['sync','records'],'readonly');
   const header=tx.objectStore('sync').get('working');
   const contents=tx.objectStore('records').getAll();
   tx.oncomplete=()=>{
    const state=header.result;
    if(!state?.order||state.version!==4)return resolve(null);
    const byKey=new Map(contents.result.map(row=>[JSON.stringify([row.collection,row.id]),row.value]));
    const lists=Object.fromEntries(Object.entries(state.order).map(([col,ids])=>
     [col,ids.map(id=>byKey.get(JSON.stringify([col,id])))]));
    if(Object.values(lists).some(rows=>rows.includes(undefined)))return resolve(null);
    const data={...state.extra,version:state.version,settings:state.settings,...lists};
    mirroredData=copySyncData(data);
    resolve({data,meta:state.meta,token:state.token});
   };
   tx.onerror=tx.onabort=()=>resolve(null);
  }catch(error){resolve(null)}
 });
}

 for(const nest of data.nests){

function relationshipPath(path){
 return path.length?path.join(' → '):'própria ave';
}
function related(a,b){
 const ancestors=start=>{
  const paths=new Map();
  let incomplete=false;
  let level=[{id:start,path:[]}];
  while(level.length){
   const next=[];
   for(const item of level){
    const bird=findAncestor(item.id);
    if(!bird){incomplete=true;continue}
    if(!paths.has(bird.id))paths.set(bird.id,item.path);
    else if(paths.get(bird.id).length<item.path.length)continue;
    if(item.path.length>=8)continue;
    next.push({id:bird.father,path:[...item.path,'pai']},{id:bird.mother,path:[...item.path,'mãe']});
   }
   level=next;
  }
  return {paths,incomplete};
 };
 const left=ancestors(a), right=ancestors(b);
 const common=[...left.paths].filter(([key])=>right.paths.has(key)).map(([key,path])=>({key,path,other:right.paths.get(key)}))
  .sort((x,y)=>x.path.length+x.other.length-y.path.length-y.other.length);
 if(!common.length)return left.incomplete||right.incomplete
  ?'ASCENDÊNCIA INCOMPLETA. O PARENTESCO NÃO PODE SER DESCARTADO COM OS DADOS CADASTRADOS.':'';
 const first=common[0];
 const parents=common.filter(x=>x.path.length===1&&x.other.length===1);
 let degree='Ancestral em comum';
 if(!first.path.length||!first.other.length){
  const generations=Math.max(first.path.length,first.other.length);
  degree=generations===1?'Pai ou mãe com descendente':generations===2?'Avô ou avó com neto ou neta':'Ascendente direto ('+generations+' gerações)';
 }else if(parents.length===2)degree='Irmãos com pai e mãe em comum';
 else if(parents.length===1){
  const side=first.path[0]===first.other[0]?first.path[0]:'';
  const complete=[findAncestor(a),findAncestor(b)].every(bird=>findAncestor(bird?.father)&&findAncestor(bird?.mother));
  degree=complete&&side?'Meio-irmãos por parte de '+side:'Um genitor em comum';
 }else if(first.path.length===2&&first.other.length===2)degree='Avô ou avó em comum';
 const details=(parents.length===2?parents:[first]).map(item=>
  birdName(findAncestor(item.key))+' (macho: '+relationshipPath(item.path)+'; fêmea: '+relationshipPath(item.other)+')');
 return degree+'. '+details.join(' · ')+(left.incomplete||right.incomplete?' Há ramos ainda sem ascendência informada.':'');
}

async function launchCanto(){
 try{
  const working=await readWorkingData();
  const journal=JSON.parse(localStorage.getItem(LOCAL_JOURNAL_KEY)||'null');
  // Before migration, the original synchronous copy takes priority over its mirror.
  let restored=journal?journal.snapshot||working?.data:legacyLocalRevision?db:working?.data;
  if(journal?.changes&&restored&&journal.token!==working?.token){
   const latest=syncCore.apply(restored,journal.changes);
   restored={...defaultDB(),...localExtra(restored),...latest,...journal.extra};
   for(const key of Object.keys(localExtra(restored)))if(!Object.hasOwn(journal.extra||{},key))delete restored[key];
  }
  if(journal&&!restored&&!journal.changes&&cloudState.meta?.dirty===false){
   // Repair an incomplete mirror only from a confirmed, matching sync baseline.
   await restoreSyncBase();
   restored=syncBase?.data;
  }
  if(journal&&!restored)throw Error('O armazenamento do navegador não pôde ser aberto. Reabra o aplicativo antes de gravar.');
  if(restored?.version===4&&validRecordCollections(restored)){
   const baseline=defaultDB();
   db={...baseline,...restored,settings:{...baseline.settings,...restored.settings}};
   if(!cloudState.meta&&working?.meta){
    localStorage.setItem(CLOUD_META_KEY,JSON.stringify(working.meta));
    cloudState.meta=working.meta;
   }
  }
 }catch(error){
  nav();
  document.getElementById('content').textContent=error.message;
  document.querySelector('.app').inert=true;
  return;
 }
 if(!localStorage.getItem(LOCAL_JOURNAL_KEY)&&!realLocalSave())return;
 seedFoods();ensureCatalogSeeds();nav();render();
 rememberWorkingData();
 openCageLinkFromAddress();
 void cloudInitialize();
}

function prepareParents(record,details){
 const pending=[];
 for(const {key,label,sex} of parentRoles){
  if(record[key]!==newAncestor)continue;
  const {name='',ring='',breeder=''}=details[key]||{};
  if(!name&&!ring)return {error:'Informe o nome ou a anilha para cadastrar o genitor externo no campo '+label+'.'};
  if(ring&&canonicalRing(ring)===canonicalRing(record.ring)){
   return {error:'A anilha do genitor deve ser diferente da anilha da própria ave.'};
  }
  const existing=ring?ancestryBirds().find(b=>canonicalRing(b.ring)===canonicalRing(ring)):null;
  if(existing&&sexValue(existing.sex)!==sex){
   return {error:'A anilha informada para '+label.toLowerCase()+' já está vinculada a uma ave de sexo diferente ou não identificado.'};
  }
  if(existing&&existing.scientific&&record.scientific&&normalizeSpecies(existing.scientific)!==normalizeSpecies(record.scientific)){
   return {error:'A anilha informada para '+label.toLowerCase()+' já identifica uma ave de outra espécie.'};
  }
  if(existing)record[key]=existing.id;
  else{
   const parent={id:'ancestral_'+id(),name,ring,breeder,sex,scientific:record.scientific,
    externalAncestor:true,createdAt:new Date().toISOString()};
   pending.push(parent);
   record[key]=parent.id;
  }
 }
 if(pending.length===2&&pending[0].ring&&canonicalRing(pending[0].ring)===canonicalRing(pending[1].ring)){
  return {error:'Pai e mãe precisam ter anilhas diferentes.'};
 }
 return {pending};
}

 if(fields.some(value=>normalizeSpecies(value).includes(term)))return true;

function planBirdCage(bird,facility){

  .sort((a,b)=>a.start.localeCompare(b.start))[0];

}

const pedigreeHeadings=['Ave','Pais','Avós','Bisavós','Trisavós'];
function pedigreeRows(root){
 const rows=[[{bird:root,side:'Ave'}]];
 for(let depth=1;depth<pedigreeHeadings.length;depth++){
  const generation=rows.at(-1).flatMap(({bird})=>[
   {bird:findAncestor(bird?.father),side:'Pai'},
   {bird:findAncestor(bird?.mother),side:'Mãe'}
  ]);
  if(depth>2&&!generation.some(entry=>entry.bird))break;
  rows.push(generation);
 }
 return rows;
}

  ['Município / UF',[municipality,state].filter(Boolean).join(' / ')]].filter(([,value])=>value);
}

  ['Sexo',sexValue(bird.sex)],['Nascimento',bird.birthDate?fmtDate(bird.birthDate):'']];

function pedigreeBranch(rows,depth,index){
 const {bird,side}=rows[depth][index];
 const next=rows[depth+1]?.slice(index*2,index*2+2);
 const label=depth===1?side:depth===2?(side==='Pai'?'Avô':'Avó'):pedigreeHeadings[depth]+' · '+side;
 return `<div class="pedigree-node">${bird?`<details class="pedigree-card">
  <summary><small>${label}</small><strong>${esc(birdName(bird))}</strong>
   <span>${esc(bird.ring||'Anilha não informada')}</span></summary>
  ${pedigreeFacts(bird)}
  ${bird.breeder||bird.externalAncestor?`<p class="helper">${esc(bird.breeder||'Outro criadouro')}</p>`:''}
  <button class="btn small secondary" data-tree="${esc(bird.id)}">Ver árvore desta ave</button>
 </details>`:`<div class="pedigree-card pedigree-missing"><small>${label}</small>Não informado</div>`}
 ${next&&(depth===1||next.some(entry=>entry.bird))?`<details class="pedigree-branch" ${depth===1?'open':''}>
  <summary>${pedigreeHeadings[depth+1]}</summary>
  <div class="pedigree-pair">${pedigreeBranch(rows,depth+1,index*2)}${pedigreeBranch(rows,depth+1,index*2+1)}</div>
 </details>`:''}</div>`;
}

}
function pedigreePDF(bird,jsPDF){
 const pdf=new jsPDF({orientation:'landscape',format:'a4'});
 const rows=pedigreeRows(bird);
 const width=pdf.internal.pageSize.getWidth();
 const column=(width-20)/rows.length;
 const box=column-6, top=50, height=143;
 const center=(depth,i)=>top+height*(i+.5)/rows[depth].length;
 const x=depth=>10+depth*column;
 const clip=(value,max)=>{
  const text=String(value||'');
  if(pdf.getTextWidth(text)<=max)return text;
  let end=text.length;
  while(end>0&&pdf.getTextWidth(text.slice(0,end)+'…')>max)end--;
  return text.slice(0,end)+'…';
 };
 pdf.setTextColor('#493426');
 pdf.setFont('helvetica','bold');pdf.setFontSize(22);pdf.text('Pedigree da ave',10,17);
 pdf.setFont('helvetica','normal');pdf.setFontSize(10);pdf.text('Canto & Ninho',width-10,16,{align:'right'});
 const fields=breederFields(bird);
 fields.forEach(([label,value],i)=>pdf.text(clip(label+': '+value,width-20),10,24+i*4));
 pdf.setDrawColor('#a18b73');pdf.setLineWidth(.25);
 rows.slice(0,-1).forEach((generation,depth)=>generation.forEach(({bird},i)=>{
  if(!bird)return;
  const from=x(depth)+box, to=x(depth+1), mid=(from+to)/2, y=center(depth,i);
  pdf.line(from,y,mid,y);
  for(const child of [i*2,i*2+1]){
   const target=center(depth+1,child);
   pdf.line(mid,y,mid,target);pdf.line(mid,target,to,target);
  }
 }));
 rows.forEach((generation,depth)=>{
  pdf.setFont('helvetica','bold');pdf.setFontSize(10);pdf.setTextColor('#493426');
  pdf.text(pedigreeHeadings[depth],x(depth),45);
  generation.forEach(({bird:ancestor,side},i)=>{
   if(!ancestor&&depth>1&&!rows[depth-1][Math.floor(i/2)].bird)return;
   const y=center(depth,i);
   const root=depth===0;
   const rowHeight=root?42:8.1;
   pdf.setFillColor(!ancestor?'#f7f4ef':i<generation.length/2?'#eee1cf':'#f4ebe0');
   pdf.setDrawColor('#c5af97');
   pdf.roundedRect(x(depth),y-rowHeight/2,box,rowHeight,1,1,'FD');
   pdf.setTextColor(ancestor?'#493426':'#725f51');
   pdf.setFont('helvetica','bold');pdf.setFontSize(root?11:8);
   pdf.text(clip(ancestor?birdName(ancestor):'Não informado',box-4),x(depth)+2,y+(root?-13:-.55));
   pdf.setFont('helvetica','normal');pdf.setFontSize(root?8:7);
   const notes=root?[
    'Anilha: '+(ancestor.ring||'Não informada'),
    'Espécie: '+(birdSpeciesLabel(ancestor)||ancestor.scientific||'Não informada'),
    ancestor.scientific&&birdSpeciesLabel(ancestor)?ancestor.scientific:'',
    'Sexo: '+sexValue(ancestor.sex),
    'Nascimento: '+(ancestor.birthDate?fmtDate(ancestor.birthDate):'Não informado')
   ].filter(Boolean):[side+(ancestor?.ring?' · '+ancestor.ring:'')];
   notes.forEach((note,j)=>pdf.text(clip(note,box-4),x(depth)+2,y+(root?-6+j*5:2.7)));
  });
 });
 pdf.setTextColor('#725f51');pdf.setFontSize(8);
 pdf.text('Ramo paterno acima · ramo materno abaixo · vínculos cadastrados no Canto & Ninho',10,202);
 return pdf;
}

async function loadBadgePhoto(src){
 const image=new Image();
 if(src.startsWith('https://'))image.crossOrigin='anonymous';
 return new Promise(resolve=>{
  const timer=setTimeout(()=>done(null),4000);
  function done(result){
   clearTimeout(timer);
   image.onload=image.onerror=null;
   resolve(result);
  }
  image.onload=()=>done(image);
  image.onerror=()=>done(null);
  image.src=src;
 });
}

 }
 fit(species?.common||'ESPÉCIE',3,59.2,28.5,10,{color:'#ffffff'});

 }
 fit('NOME DA AVE',38.5,6,57.5,6.3,{color:muted});

 pdf.setDrawColor('#bdc7b8');pdf.line(38.5,18,96,18);

 field('NASCIMENTO',fmtDate(bird.birthDate),38.5,47.5,31);
 field('SEXO',sexValue(bird.sex),73,47.5,23,9);

let cageCamera=null;
function stopCageCamera(){
 if(!cageCamera)return;
 cageCamera.stream?.getTracks().forEach(track=>track.stop());
 cancelAnimationFrame(cageCamera.frame);
 cageCamera=null;
}
function cageIdFromQR(value){
 try{
  const url=new URL(value), base=new URL('./',location.href);
  if(url.origin!==base.origin||![base.pathname,base.pathname+'index.html'].includes(url.pathname))return '';
  return new URLSearchParams(url.hash.slice(1)).get('gaiola')||'';
 }catch(error){return ''}
}
function openCageScanner(){
 stopCageCamera();
 const units=db.facilities.filter(unit=>upper(unit.type)==='GAIOLA'&&!cageUnavailable(unit));
 modal('Ler QR da gaiola',`<div id="cageScanner"><p class="helper">Aponte a câmera para a etiqueta do Canto &amp; Ninho.</p>
  <video muted playsinline hidden></video><p id="cageScanMessage" role="status"></p>
  <button type="button" class="btn" id="startCageCamera">Ativar câmera</button>
  ${units.length?`<form id="cageManualForm"><label for="cageManual">Selecionar gaiola pelo nome</label>
  <select id="cageManual" required><option value="">Selecione</option>${byName(units).map(unit=>
    `<option value="${esc(unit.id)}">${esc(unit.name)}</option>`).join('')}</select>
  <button class="btn secondary" type="submit">Abrir gaiola</button></form>`:''}
  <div class="modal-foot"><button class="btn secondary" data-action="close">Fechar</button></div></div>`);
 const panel=document.getElementById('cageScanner'), video=panel.querySelector('video'), button=panel.querySelector('#startCageCamera');
 const message=panel.querySelector('#cageScanMessage'), manual=panel.querySelector('form');
 const visit=unitId=>{stopCageCamera();closeModal();openCageSheet(unitId)};
 if(manual)manual.onsubmit=event=>{event.preventDefault();visit(manual.querySelector('select').value)};
 button.onclick=async()=>{
  if(!navigator.mediaDevices?.getUserMedia||!globalThis.jsQR){
   message.textContent='Câmera indisponível neste navegador. Selecione a gaiola pelo nome.';return;
  }
  button.disabled=true;
  const session={stream:null,frame:0};
  cageCamera=session;
  try{
   const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
   if(cageCamera!==session||!panel.isConnected){stream.getTracks().forEach(track=>track.stop());return}
   session.stream=stream;video.srcObject=stream;video.hidden=false;
   await video.play();
   const canvas=document.createElement('canvas'), context=canvas.getContext('2d',{willReadFrequently:true});
   if(!context)throw Error('Vídeo indisponível');
   let nextScan=0;
   const tick=time=>{
    if(cageCamera!==session||!panel.isConnected){if(cageCamera===session)stopCageCamera();return}
    if(time>=nextScan&&video.readyState>=2&&video.videoWidth){
     nextScan=time+200;
     const ratio=Math.min(1,960/video.videoWidth);
     canvas.width=Math.round(video.videoWidth*ratio);
     canvas.height=Math.round(video.videoHeight*ratio);
     context.drawImage(video,0,0,canvas.width,canvas.height);
     const pixels=context.getImageData(0,0,canvas.width,canvas.height);
     const decoded=globalThis.jsQR(pixels.data,pixels.width,pixels.height);
     if(decoded){
      const unitId=cageIdFromQR(decoded.data);
      if(unitId){visit(unitId);return}
      message.textContent='Este QR não é uma etiqueta de gaiola deste aplicativo.';
     }
    }
    session.frame=requestAnimationFrame(tick);
   };
   session.frame=requestAnimationFrame(tick);
  }catch(error){
   if(cageCamera===session)stopCageCamera();
   video.hidden=true;button.disabled=false;
   message.textContent='Não foi possível abrir a câmera. Confira a permissão ou selecione a gaiola pelo nome.';
  }
 };
}

async function managePush(action){
 if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))
  throw Error('Notificações indisponíveis aqui. No iPhone ou iPad, abra o aplicativo pela Tela de Início. Os lembretes continuam na Agenda.');
 if(!cloudState.ready)throw Error('Entre na nuvem pelo botão no cabeçalho para gerenciar notificações.');
 if(!navigator.onLine)throw Error('Conecte-se à internet para gerenciar notificações.');
 if(action==='enable'){
  const permission=await Notification.requestPermission();
  if(permission!=='granted')throw Error('Permissão não concedida. Confira as permissões do navegador ou do aparelho.');
 }
 const registration=await navigator.serviceWorker.getRegistration();
 if(!registration?.active)throw Error('Reabra o aplicativo para concluir a instalação das notificações.');
 let subscription=await registration.pushManager.getSubscription();
 if(action==='enable'){
  const {publicKey}=await cloudAPI('/api/push');
  const applicationServerKey=pushApplicationKey(publicKey);
  if(subscription&&!syncCore.same(
   [...new Uint8Array(subscription.options.applicationServerKey||[])],[...applicationServerKey]
  )){
   await cloudAPI('/api/push','POST',{action:'disable',endpoint:subscription.endpoint});
   await subscription.unsubscribe();
   subscription=null;
  }
  const fresh=!subscription;
  subscription||=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey});
  try{await cloudAPI('/api/push','POST',{...subscription.toJSON(),action});}
  catch(error){if(fresh)await subscription.unsubscribe().catch(()=>{});throw error;}
  return 'Notificações ativadas neste aparelho.';
 }
 if(!subscription){
  if(action==='disable')return 'Este aparelho não tem uma inscrição ativa no navegador.';
  throw Error('Ative as notificações neste aparelho antes de enviar o teste.');
 }
 await cloudAPI('/api/push','POST',{action,endpoint:subscription.endpoint});
 if(action==='test')return 'Teste enviado. Confira a central de notificações do aparelho.';
 await subscription.unsubscribe();
 return 'Notificações desativadas neste aparelho.';
}
document.addEventListener('click',async event=>{
 const button=event.target.closest('[data-push-action]');
 if(!button)return;
 const feedback=document.getElementById('pushFeedback');
 const controls=[...button.parentElement.querySelectorAll('button')];
 controls.forEach(control=>control.disabled=true);
 try{feedback.textContent=await withPushLock(()=>managePush(button.dataset.pushAction));}
 catch(error){feedback.textContent=error.message||'Não foi possível gerenciar notificações.';}
 finally{controls.forEach(control=>control.disabled=false);}
});
let pendingReminderLink='';
function followReminderLink(hash=location.hash.slice(1)){
 const params=new URLSearchParams(hash);
 const kind=params.get('lembrete'), ref=params.get('ref');
 if(kind==='agenda'&&activeAccount){go('events');return}
 if(kind==='management'){
  const day=params.get('dia');
  if(!validFinanceDate(day))return;
  taskReminderDay=day;
  pendingReminderLink=cloudState.ready?'':hash;
  go('tasks');
  const panel=document.getElementById('taskReminder');
  panel?.scrollIntoView({block:'start'});
  panel?.focus({preventScroll:true});
  return;
 }
 if(!['teste','ovoscopy','hatching','ringing','document','tournament'].includes(kind))return;
 pendingReminderLink=hash;
 go('events');
 const found=agendaNotices().find(item=>{
  if(item.date!==params.get('dia'))return false;
  if(kind==='ovoscopy')return item.source===ref&&item.label==='Ovoscopia';
  if(kind==='hatching')return item.source===ref&&item.expected===params.get('prev');
  if(kind==='ringing')return item.chick===ref;
  if(kind==='document')return item.document===ref;
  return kind==='tournament'&&item.type==='tournament'&&item.source===ref;
 });
 if(!found){
  if(kind==='teste'||cloudState.ready)pendingReminderLink='';
  return;
 }
 pendingReminderLink='';
 const list=document.querySelector('#agendaAutomatic');
 const items=[...list.querySelectorAll('.mini-list > li')];
 // The same ordered Agenda array is rendered on this page.
 const target=items.find(row=>row.dataset.agendaKey===JSON.stringify([
  found.type,found.label,found.date,found.source,found.chick,found.document,found.expected
 ]));
 if(target){
  target.classList.add('notification-target');
  target.scrollIntoView({block:'center'});
  target.focus({preventScroll:true});
 }
}
window.addEventListener('hashchange',()=>{
 const invite=new URLSearchParams(location.hash.slice(1)).get('convite');
 if(invite){
  if(activeAccount)cloudShowStatus();
  else cloudShow('redeem','',invite);
 }else if(activeAccount)followReminderLink();
});
navigator.serviceWorker?.addEventListener('message',event=>{
 if(event.data?.account===activeAccount&&typeof event.data?.reminder==='string')followReminderLink(event.data.reminder);
});

if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
const inviteToken=new URLSearchParams(location.hash.slice(1)).get('convite');
if(activeAccount){
 document.querySelector('.app').style.display='';
 await launchCanto();
 followReminderLink();
 if(inviteToken)cloudShowStatus();
}else{
 cloudShow(inviteToken?'redeem':'login','',inviteToken||'');
}
})().catch(error=>{
 console.error(error);
 const message=document.createElement('p');
 message.textContent='Não foi possível abrir o Canto & Ninho. Reabra o aplicativo.';
 document.body.append(message);
});

</script></body></html>
