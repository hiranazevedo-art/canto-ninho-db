<!-- ESCOPO CONSOLIDADO DA ATUALIZAÇÃO
1. Corrigir IDs e validar pai/mãe sem modificar automaticamente o sexo das aves.
2. Integrar casal, temporada, tentativa, ninhada, ovos e filhotes por referências; proteger o histórico.
3. Registrar separação individual, situação com os pais e idade em dias.
4. Manejo: atividades predefinidas, múltiplas aves, selecionar todas, sem campo Responsável.
5. Alimentação: múltiplas aves, sem Unidade/Frequência/Horário; catálogo padrão editável com composição fornecida.
6. Preservar oito campos do plantel, identidade visual, chave de armazenamento, dados legados e backups.
Limite do arquivo recebido: armazenamento local, sem API, servidor ou sincronização híbrida.
-->

function go(next,{history=true,sub,focus=true}={}){

const grainStockCategory='GRÃOS SECOS E GERMINADOS';

function validFinanceDate(date){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;
 const parsed=new Date(date+'T00:00:00Z');
 return !Number.isNaN(parsed.getTime())&&parsed.toISOString().slice(0,10)===date;
}
function moneyCents(value){return Math.round(Number(value)*100)}
function cageProduct(item){return upper(item?.category)===cageCategory}
function physicalSaleDate(sale){return sale?.deliveryDate===undefined?sale?.date||'':sale.deliveryDate}
function saleOutside(sale){return !!physicalSaleDate(sale)&&(!sale.cancelledDate||sale.returnPending===true)}
function birdOutside(id){return db.revenues.find(sale=>sale.kind==='bird'&&sale.itemId===id&&saleOutside(sale))}
function activeBirdSale(birdId){return db.revenues.find(r=>!r.cancelledDate&&r.kind==='bird'&&r.itemId===birdId)}
function stockReserved(itemId,excluding=''){
 return db.revenues.filter(s=>s.kind==='cage'&&s.itemId===itemId&&s.id!==excluding&&!s.cancelledDate&&!physicalSaleDate(s))
  .reduce((total,s)=>total+Number(s.quantity),0);
}

 };
}

 </fieldset>`;

function financeTotals(period,expenses=expenseRows()){
 const includes=date=>typeof date==='string'&&date.startsWith(period);
 const totals={received:0,refunds:0,receivable:0,paid:0,payable:0};
 for(const sale of db.revenues){
  const amount=moneyCents(sale.value);
  if(sale.paymentStatus===paymentReceived){
   if(includes(sale.receivedDate))totals.received+=amount;
   if(includes(sale.cancelledDate))totals.refunds+=amount;
  }else if(!sale.cancelledDate&&includes(sale.date))totals.receivable+=amount;
 }
 for(const expense of expenses){
  if(expense.expenseStatus===expenseOpen){
   if(includes(expense.date))totals.payable+=moneyCents(expense.value);
  }else if(includes(expense.expensePaidDate||expense.date))totals.paid+=moneyCents(expense.value);
 }
 return {...totals,balance:totals.received-totals.refunds-totals.paid};
}

function saveSale(fields,oldId,linksReviewed=false,pickedCages=[]){
 const old=oldId?getRecord('revenues',oldId):null;
 if(oldId&&(!old||old.cancelledDate))return 'Esta venda já foi cancelada ou não está mais disponível.';
 const bird=fields.kind==='bird',item=getRecord(bird?'birds':'stock',fields.itemId);
 if(!item||(!bird&&!cageProduct(item)))return 'Selecione um item disponível para venda.';
 if(old&&(old.kind!==fields.kind||old.itemId!==item.id))return 'O item da venda já registrada precisa ser mantido.';
 const date=fields.date,received=fields.paymentStatus===paymentReceived;
 if(!validFinanceDate(date))return 'Informe uma data de venda válida.';
 if(![paymentReceived,paymentOpen].includes(fields.paymentStatus))return 'Informe a situação do pagamento.';
 if(received&&(!validFinanceDate(fields.receivedDate)||fields.receivedDate<date))return 'Informe o recebimento na data da venda ou em uma data posterior.';
 const alreadyDelivered=!!physicalSaleDate(old), deliveryDate=physicalSaleDate(old)||fields.deliveryDate||'';
 if(deliveryDate&&(!validFinanceDate(deliveryDate)||deliveryDate<date))return 'Informe a entrega na data da venda ou depois.';
 if(bird&&deliveryDate&&!alreadyDelivered&&!linksReviewed){
  const links=birdExitLinks(item.id);
  if(links.couples||links.tasks)return 'Confira os vínculos antes de registrar a entrega.';
 }
 if(bird&&birdOutside(item.id)&&birdOutside(item.id).id!==oldId)return 'Esta ave ainda não retornou ao plantel.';
 const quantity=fields.quantity,cents=moneyCents(fields.unitPrice)*quantity;
 if(!Number.isSafeInteger(quantity)||quantity<1||!Number.isSafeInteger(cents)||cents<=0)return 'Informe uma quantidade inteira e um valor maior que zero.';
 if(bird&&quantity!==1)return 'Registre uma ave por venda.';
 if(bird&&db.revenues.some(r=>r.kind==='bird'&&r.itemId===item.id&&!r.cancelledDate&&r.id!==oldId))return 'Esta ave já tem uma venda registrada.';
 const available=bird?0:Number(item.quantity)+Number(alreadyDelivered?old.quantity:0);
 const movement=bird||!alreadyDelivered?null:db.movements.find(m=>m.saleId===oldId&&m.stock===item.id&&m.type==='SAÍDA');
 if(!bird&&alreadyDelivered&&!movement)return 'A saída vinculada não foi localizada. Confira o histórico de estoque.';
 if(!bird&&(!Number.isFinite(available)||quantity>available-stockReserved(item.id,oldId)))return 'Estoque insuficiente para esta venda.';
 const previous=JSON.stringify(db), stamp=new Date().toISOString();
 const record={...old,...fields,deliveryDate,id:oldId||id(),itemName:old?.itemName||(bird?birdName(item)+(item.ring&&item.ring!==birdName(item)?' · '+item.ring:''):item.name),
  unitPrice:moneyCents(fields.unitPrice)/100,value:cents/100,receivedDate:received?fields.receivedDate:'',
  acquisitionCost:old?old.acquisitionCost:(bird&&Number(item.acquisitionValue)>0?Number(item.acquisitionValue):null),
  createdAt:old?.createdAt||stamp,updatedAt:stamp};
 if(!bird&&deliveryDate){
  const cageError=syncCageUnits(item)||allocateSaleCages(item,record,alreadyDelivered?old:null,pickedCages);
  if(cageError){db=JSON.parse(previous);return cageError}
  item.quantity=available-quantity;
  const output={stock:item.id,type:'SAÍDA',quantity,date:deliveryDate,notes:'VENDA DE GAIOLA',saleId:record.id,updatedAt:stamp};
  if(movement)Object.assign(movement,output);
  else db.movements.push({id:id(),createdAt:stamp,...output});
  const cageErrorAfter=syncCageUnits(item);
  if(cageErrorAfter){db=JSON.parse(previous);return cageErrorAfter}
 }
 if(old)Object.assign(old,record);else db.revenues.push(record);
 if(persist('revenues',old?'EDITAR VENDA':'REGISTRAR VENDA',record))return '';
 db=JSON.parse(previous);
 return 'Não foi possível gravar a venda. O preenchimento foi preservado.';
}
function returnSoldItem(sale,date){
 if(sale.kind==='cage'){
  const item=getRecord('stock',sale.itemId);
  const movement=db.movements.find(m=>m.saleId===sale.id&&m.stock===sale.itemId&&m.type==='SAÍDA');
  if(!item||!movement||!Number.isFinite(Number(item.quantity)))return 'A saída vinculada não foi localizada. Confira o estoque.';
  const linked=(sale.cageFacilityIds||[]).map(id=>getRecord('facilities',id));
  if(linked.some(unit=>!unit||unit.cageStockId!==item.id||unit.cageSaleId!==sale.id))return 'As gaiolas vinculadas à venda não foram localizadas.';
  for(const unit of linked){delete unit.cageSaleId;unit.cageOffStock=false}
  item.quantity=Number(item.quantity)+Number(sale.quantity);
  db.movements.push({id:id(),stock:item.id,type:'ENTRADA',quantity:sale.quantity,date,
   notes:'DEVOLUÇÃO DE VENDA',saleId:sale.id,createdAt:new Date().toISOString()});
  const cageError=syncCageUnits(item);
  if(cageError)return cageError;
 }
 sale.returnedDate=date;
 sale.returnPending=false;
 return '';
}
function changeSaleReturn(saleId,date,returnNow,returnOnly=false){
 const sale=getRecord('revenues',saleId);
 if(!sale||(returnOnly?!sale.cancelledDate||!sale.returnPending:!!sale.cancelledDate))return 'Esta ação não está mais disponível para a venda.';
 const delivered=physicalSaleDate(sale);
 const minDate=(returnOnly?[sale.cancelledDate,delivered]:[sale.date,sale.receivedDate,delivered]).filter(Boolean).sort().at(-1);
 if(!validFinanceDate(date)||date<minDate)return 'Informe uma data igual ou posterior às datas já registradas nesta venda.';
 const previous=JSON.stringify(db);
 if(returnNow&&delivered){
  const error=returnSoldItem(sale,date);
  if(error){db=JSON.parse(previous);return error}
 }else if(delivered)sale.returnPending=true;
 if(!returnOnly)sale.cancelledDate=date;
 if(persist('revenues',returnOnly?'REGISTRAR DEVOLUÇÃO':'CANCELAR VENDA',sale))return '';
 db=JSON.parse(previous);
 return 'Não foi possível gravar a alteração.';
}

function descValue(k,val){if(!val)return '—';if(k==='bird')return birdIds(val).map(x=>esc(birdName(findBird(x)))).join(', ')||'—';if(k==='male'||k==='female')return esc(birdName(findBird(val)));const map={food:['food','name'],season:['seasons','name'],couple:['couples','male'],attempt:['attempts','id'],nest:['nests','name'],egg:['eggs','name'],stock:['stock','name'],facility:['facilities','name']};if(map[k]){const [col,field]=map[k];const obj=getRecord(col,val);if(!obj)return 'REMOVIDO';return k==='couple'?esc(birdName(findBird(obj.male)))+' + '+esc(birdName(findBird(obj.female))):k==='attempt'?'TENTATIVA '+esc(obj.start||obj.id.slice(0,6)):esc(obj[field])}if(['date','start','end','expiry','done','revised','separatedAt'].includes(k)&&/^\d{4}-\d{2}-\d{2}$/.test(val))return fmtDate(val);if(k==='value'||k==='cost')return brl(val);return esc(val)}
function generic(type){const cfg=configs[type],found=(type==='expenses'?expenseRows():db[type]).filter(x=>Object.values(x).join(' ').includes(upper(query))||!query);return `${header(cfg.title,cfg.subtitle,'Novo registro','new:'+type)}<div class="toolbar"><input id="search" class="field" placeholder="Buscar registros..." value="${esc(query)}"></div>${table([...cfg.cols.map(c=>c[0]),'Ações'],found.map(x=>[...cfg.cols.map(c=>cellValue(type,x,c[1])),act(type,x)]))}`}

function pairLabel(couple){
 return birdName(findBird(couple.male))+' × '+birdName(findBird(couple.female));
}
function pairNests(coupleId){
 return db.nests.filter(nest=>sameId(lineage('nests',nest).couple?.id,coupleId))
  .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
}
function nestChicks(nestId){
 return db.chicks.filter(chick=>sameId(chick.nest,nestId)||sameId(getRecord('eggs',chick.egg)?.nest,nestId));
}
function nestSummary(nest){
 const eggs=db.eggs.filter(egg=>sameId(egg.nest,nest.id)), chicks=nestChicks(nest.id);
 const hatched=eggs.filter(egg=>egg.status==='ECLODIDO').length;
 const lost=eggs.filter(egg=>['INFÉRTIL','NÃO ECLODIDO'].includes(egg.status)).length;
 const open=Math.max(0,eggs.length-Math.max(hatched,chicks.length)-lost);
 return `${eggs.length?eggs.length+' '+(eggs.length===1?'ovo':'ovos'):'Ovos não informados'} · ${chicks.length} ${chicks.length===1?'filhote registrado':'filhotes registrados'}${!nest.closedAt&&open?' · '+open+' '+(open===1?'ovo a conferir':'ovos a conferir'):''}`;
}

function reproduction(){

  return upper(parents.map(bird=>[birdName(bird),bird?.ring].join(' ')).join(' ')).includes(upper(query));

function makeQuickNest(coupleId,date,stamp){
 const year=date.slice(0,4);
 let season=db.seasons.filter(item=>sameId(item.couple,coupleId)&&item.start&&item.start<=date&&
  (item.end?date<=item.end:item.start.startsWith(year))).sort((a,b)=>b.start.localeCompare(a.start))[0];
 if(!season){
  season={id:id(),name:'TEMPORADA '+year,couple:coupleId,start:year+'-01-01',createdAt:stamp,quickRepro:true};
  db.seasons.push(season);
 }
 const attempt={id:id(),season:season.id,couple:coupleId,start:date,createdAt:stamp,quickRepro:true};
 db.attempts.push(attempt);
 const next={id:id(),attempt:attempt.id,name:'NINHADA '+fmtDate(date),date,createdAt:stamp,quickRepro:true};
 db.nests.push(next);
 return next;
}
function nestRecordDate(nest){
 const dates=[nest.date,...db.eggs.filter(egg=>sameId(egg.nest,nest.id)).map(egg=>egg.date),...nestChicks(nest.id).map(chick=>chick.date)];
 return dates.filter(validFinanceDate).sort().at(-1)||'';
}
function finishReproChange(type,action,record,previous){
 if(persist(type,action,record))return '';
 db=JSON.parse(previous);
 return 'Não foi possível salvar. Confira o armazenamento e tente novamente.';
}
function saveQuickRepro(action,coupleId,nestId,date,amount,result=''){
 if(!Object.hasOwn(quickReproActions,action)||!validFinanceDate(date))return 'Informe uma data válida.';
 const couple=getRecord('couples',coupleId);
 if(!couple)return 'O casal não foi encontrado.';
 const closing=action==='close';
 if(!closing&&((couple.start&&date<couple.start)||(couple.end&&date>couple.end)))return 'Informe uma data dentro do período do casal.';
 if(!nestId||closing&&nestId==='new')return 'Selecione a ninhada.';
 let nest=nestId==='new'?null:getRecord('nests',nestId);
 if(nestId!=='new'&&(!nest||nest.closedAt||!sameId(lineage('nests',nest).couple?.id,couple.id)))return 'Selecione uma ninhada aberta deste casal.';
 const earlierPosture=action==='eggs'&&nest?.quickRepro&&nest.date&&date<nest.date&&
  !db.eggs.some(egg=>sameId(egg.nest,nest.id));
 const attempt=earlierPosture?getRecord('attempts',nest.attempt):null;
 const season=attempt?getRecord('seasons',attempt.season):null;
 const canBackfill=!!(attempt?.quickRepro&&season?.start<=date&&(!season.end||date<=season.end));
 if(nest?.date&&date<nest.date&&!canBackfill)return 'A data é anterior à abertura da ninhada.';
 if(closing){
  if(!nestResults.includes(result))return 'Escolha o resultado da ninhada.';
  const hasChicks=nestChicks(nest.id).length>0;
  if(hasChicks&&result==='Sem nascimentos')return 'Há filhotes registrados nesta ninhada. Confira o resultado.';
  if(!hasChicks&&result==='Com filhotes')return 'Registre o nascimento dos filhotes antes de encerrar com esse resultado.';
  if(date<nestRecordDate(nest))return 'A data de encerramento deve ser igual ou posterior ao último registro da ninhada.';
 }else if(!Number.isInteger(amount)||amount<1||amount>100)return 'Informe uma quantidade inteira de 1 a 100 por lançamento.';
 const previous=JSON.stringify(db),stamp=new Date().toISOString();
 if(!nest)nest=makeQuickNest(couple.id,date,stamp);
 if(canBackfill){
  nest.date=date;
  if(nest.name==='NINHADA '+fmtDate(attempt.start))nest.name='NINHADA '+fmtDate(date);
  attempt.start=date;
 }
 if(closing){
  Object.assign(nest,{closedAt:date,closeResult:result,updatedAt:stamp});
  return finishReproChange('nests','ENCERRAR NINHADA',nest,previous);
 }
 const existing=action==='eggs'
  ?db.eggs.filter(egg=>sameId(egg.nest,nest.id))
  :nestChicks(nest.id);
 const names=new Set(existing.map(row=>upper(row.name)));
 const prefix=action==='eggs'?'OVO':'FILHOTE';
 let number=1;
 for(let index=0;index<amount;index++){
  while(names.has(prefix+' '+number))number++;
  const name=prefix+' '+number;
  names.add(name);
  db[action].push({id:id(),name,nest:nest.id,date,createdAt:stamp,...(action==='eggs'?{status:'REGISTRADO'}:{couple:couple.id})});
 }
 return finishReproChange(action,action==='eggs'?'REGISTRAR POSTURA':'REGISTRAR NASCIMENTO',nest,previous);
}

 const selected=nestId||(!nests.length&&!closing?'new':'');
 const choices=[...(closing?[]:[['new','Abrir nova ninhada']]),...nests.map(nest=>[nest.id,(nest.name||'Ninhada')+' · '+nestSummary(nest)])];

  </select></div>
  ${input('date',closing?'Data do encerramento':action==='eggs'?'Data da postura':'Data do nascimento','date',today(),true)}
  ${closing?select('result','Resultado',nestResults,'',true):input('amount',action==='eggs'?'Quantidade de ovos':'Quantidade de filhotes','number',1,true,'min="1" max="100" step="1"')}
  </div><p class="form-feedback" role="alert" hidden></p>
  <div class="modal-foot"><button type="button" class="btn secondary" data-action="close">Cancelar</button>
  <button type="submit" class="btn">${closing?'Encerrar ninhada':'Salvar registro'}</button></div></form>`);
 const form=document.getElementById('quickReproForm');
 form.onsubmit=event=>{
  event.preventDefault();
  const f=form.elements,error=saveQuickRepro(action,coupleId,f.nest.value,f.date.value,Number(f.amount?.value),f.result?.value);
  if(error)return formFeedback(form,error);
  closeModal();render();toast(closing?'Ninhada encerrada.':'Registro salvo.');
 };
}
function saveQuickChick(chickId,field,value){
 const chick=getRecord('chicks',chickId);
 if(!chick||!['ring','separatedAt'].includes(field))return 'O filhote não foi encontrado.';
 const updated={...chick,[field]:value.trim()};
 const issue=validateIntegrated('chicks',updated,chick)||validate('chicks',updated,chick.id);
 if(issue)return issue;
 if(field==='separatedAt'&&updated.separatedAt&&!validFinanceDate(updated.separatedAt))return 'Informe uma data válida.';
 if(field==='ring'&&updated.ring){
  const ring=upper(updated.ring);
  if(db.birds.some(bird=>upper(bird.ring).trim()===ring))return 'Esta anilha já está cadastrada no Plantel.';
  if(db.chicks.some(other=>other!==chick&&upper(other.ring).trim()===ring))return 'Esta anilha já está cadastrada em outro filhote.';
 }
 if(chick[field]===updated[field])return '';
 const previous=JSON.stringify(db),stamp=new Date().toISOString();
 if(field==='separatedAt'){
  updated.separationHistory=[...(chick.separationHistory||[]),{at:stamp,from:chick.separatedAt||'',to:updated.separatedAt||''}];
 }
 Object.assign(chick,updated,{updatedAt:stamp});
 return finishReproChange('chicks',field==='ring'?'EDITAR ANILHA':'REGISTRAR SEPARAÇÃO',chick,previous);
}

function mixIngredients(food){
 const lines=String(food?.composition||'').trim().split(/\r?\n/).filter(line=>line.trim());
 const ingredients=lines.map(line=>{
  const row=/^\s*(.+?)\s*:\s*(\d+(?:[,.]\d{1,2})?)\s*%\s*$/.exec(line);
  return row?{name:row[1],parts:Math.round(Number(row[2].replace(',','.'))*100)}:null;
 });
 return ingredients.every(Boolean)&&ingredients.reduce((sum,item)=>sum+item.parts,0)===10000?ingredients:[];
}
function mixWeights(ingredients,grammes){
 const total=Math.round(grammes*100);
 const shares=ingredients.map(({parts})=>Math.floor(total*parts/10000));
 const order=ingredients.map(({parts},index)=>({index,remainder:total*parts%10000})).sort((a,b)=>b.remainder-a.remainder);
 const leftover=total-shares.reduce((sum,value)=>sum+value,0);
 for(const {index} of order.slice(0,leftover))shares[index]++;
 return shares.map(value=>value/100);
}

function cageUnits(stockId){
 return db.facilities.filter(f=>f.cageStockId===stockId);
}
function cageInUse(unit,date=today()){
 return db.transfers.some(t=>sameId(t.facility,unit.id)&&(!t.end||t.end>date));
}
function cageUnavailable(unit){
 return !!(unit.cageRetired||unit.cageOffStock||unit.cageSaleId);
}
function cageTransfers(unit){
 return db.transfers.filter(t=>sameId(t.facility,unit.id)&&(!t.start||t.start<=today())&&(!t.end||t.end>today()));
}
function syncCageUnits(item){
 if(!item||!cageProduct(item))return '';
 const capacity=Number(item.quantity);
 if(!Number.isSafeInteger(capacity)||capacity<0)return 'Confira o saldo inteiro de gaiolas no Estoque.';
 const movements=db.movements.filter(m=>m.stock===item.id);
 const opening=capacity-movements.reduce((sum,m)=>sum+(m.type==='ENTRADA'?1:-1)*Number(m.quantity),0);
 const sources=new Map([['stock:'+item.id,Math.max(0,opening)]]);
 for(const move of movements)if(move.type==='ENTRADA'&&!move.saleId)sources.set('movement:'+move.id,Number(move.quantity));
 const units=cageUnits(item.id);
 for(const unit of units)if(!sources.has(unit.cageOrigin))sources.set(unit.cageOrigin,0);
 const titles=new Set(db.facilities.map(f=>upper(f.name)));
 let index=1;
 const occupied=unit=>cageInUse(unit);
 const protectedUnit=unit=>Boolean(unit.cageSaleId)||occupied(unit);
 for(const [source,total] of sources){
  if(!Number.isSafeInteger(total)||total<0)return 'Confira as quantidades nas entradas de gaiolas.';
  const batch=units.filter(unit=>unit.cageOrigin===source)
   .sort((a,b)=>Number(protectedUnit(b))-Number(protectedUnit(a))||Number(!!b.cageManualLink)-Number(!!a.cageManualLink)||Number(!!a.cageRetired)-Number(!!b.cageRetired));
  if(batch.filter(protectedUnit).length>total)return 'A quantidade da entrada não pode ficar abaixo das gaiolas ocupadas ou já entregues dessa entrada.';
  batch.forEach((unit,i)=>{unit.cageRetired=i>=total;});
  for(let i=batch.length;i<total;i++){
   while(titles.has(upper(item.name)+' '+index))index++;
   const name=upper(item.name)+' '+index++;
   titles.add(name);
   const unit={id:id(),name,type:'GAIOLA',cageStockId:item.id,cageOrigin:source,createdAt:new Date().toISOString()};
   units.push(unit);db.facilities.push(unit);
  }
 }
 const candidates=units.filter(unit=>!unit.cageRetired&&!unit.cageSaleId)
  .sort((a,b)=>Number(occupied(b))-Number(occupied(a))||Number(!!a.cageOffStock)-Number(!!b.cageOffStock));
 if(candidates.filter(occupied).length>capacity)return 'Libere as gaiolas ocupadas ou reservadas em Instalações antes de baixar esse saldo.';
 if(candidates.length<capacity)return 'O saldo de gaiolas não corresponde às entradas registradas.';
 candidates.forEach((unit,i)=>{unit.cageOffStock=i>=capacity});
 return '';
}
function reconcileCageChanges(type,record,old){
 const items=type==='stock'?[record.id]:type==='movements'?[old?.stock,record.stock]:[];
 for(const itemId of new Set(items.filter(Boolean))){
  const error=syncCageUnits(getRecord('stock',itemId));
  if(error)return error;
 }
 return '';
}
function allocateSaleCages(item,record,old,pickedCages){
 const prevIds=old?.cageFacilityIds||[];
 if(prevIds.some(unitId=>!cageUnits(item.id).some(unit=>unit.id===unitId&&unit.cageSaleId===record.id)))return 'As gaiolas vinculadas à venda não foram localizadas.';
 const unidentified=Math.min(Number(old?.cageUnidentifiedQuantity??(old&&!old.cageFacilityIds?old.quantity:0)),record.quantity);
 const wanted=record.quantity-unidentified;
 const current=prevIds.slice(0,wanted);
 const available=cageUnits(item.id).filter(unit=>!cageUnavailable(unit)&&!cageInUse(unit,record.deliveryDate));
 const extra=wanted-current.length;
 const chosen=pickedCages.length?available.filter(unit=>pickedCages.includes(unit.id)):available.slice(0,extra);
 if(pickedCages.length&&(chosen.length!==extra||chosen.length!==pickedCages.length))return 'Confira se a seleção contém uma gaiola livre para cada unidade vendida.';
 if(extra>chosen.length)return 'Não há gaiolas livres suficientes. Encerre a ocupação em Instalações antes da entrega.';
 for(const unitId of prevIds.slice(wanted))delete getRecord('facilities',unitId).cageSaleId;
 for(const unit of chosen){unit.cageSaleId=record.id;current.push(unit.id)}
 record.cageFacilityIds=current;
 record.cageUnidentifiedQuantity=unidentified;
 return '';
}

function linkCageToStock(unitId,stockId){
 const unit=getRecord('facilities',unitId),item=getRecord('stock',stockId);
 if(!unit||unit.cageStockId||upper(unit.type)!=='GAIOLA'||!cageProduct(item))return 'Selecione uma gaiola e um produto disponíveis.';
 const previous=JSON.stringify(db);
 const error=syncCageUnits(item);
 const placeholder=cageUnits(item.id).find(candidate=>!candidate.cageManualLink&&!cageUnavailable(candidate)&&
  !db.transfers.some(t=>sameId(t.facility,candidate.id))&&!db.tasks.some(t=>sameId(t.facility,candidate.id)));
 if(error||!placeholder){db=JSON.parse(previous);return error||'Não há uma ficha automática disponível sem histórico para vincular.'}
 Object.assign(unit,{cageStockId:item.id,cageOrigin:placeholder.cageOrigin,cageManualLink:true});
 db.facilities=db.facilities.filter(candidate=>candidate!==placeholder);
 if(!persist('facilities','VINCULAR GAIOLA AO ESTOQUE',unit)){db=JSON.parse(previous);return 'Não foi possível salvar o vínculo.'}
 return '';
}

function stockAcquisitionQuantity(record){
 if(record.acquisitionQuantity!==undefined&&record.acquisitionQuantity!==null&&record.acquisitionQuantity!=='')return Number(record.acquisitionQuantity);
 const movementNet=db.movements.filter(m=>sameId(m.stock,record.id)).reduce((sum,m)=>
  sum+(m.type==='ENTRADA'?1:-1)*Number(m.quantity||0),0);
 const inferred=Number((Number(record.quantity)-movementNet).toFixed(8));
 return Number.isFinite(inferred)&&inferred>0?inferred:null;
}
function stockExpenseValue(type,record){
 if(type==='movements'&&record.type!=='ENTRADA')return 0;
 const quantity=type==='stock'?stockAcquisitionQuantity(record):Number(record.quantity);
 const total=Number(record.cost)||Number(record.unitCost)*quantity;
 const cents=Math.round((total+Number.EPSILON)*100);
 return Number.isSafeInteger(cents)&&cents>0?cents/100:0;
}
function stockExpenseKey(date,value){return JSON.stringify([date,Math.round(Number(value)*100)])}
function stockExpenseCandidates(){
 const manualKeys=new Set(db.expenses.filter(e=>!e.birdAcquisitionId).map(e=>stockExpenseKey(e.date,e.value)));
 const result=[];
 for(const [type,records] of [['stock',db.stock],['movements',db.movements]]){
  for(const record of records){
   const value=stockExpenseValue(type,record);
   if(!value)continue;
   const product=type==='stock'?record:getRecord('stock',record.stock);
   const possibleDuplicate=!record.stockExpenseConfirmed&&manualKeys.has(stockExpenseKey(record.date,value));
   const date=String(record.date||'');
   const parsed=new Date(date+'T00:00:00Z');
   const validDate=/^\d{4}-\d{2}-\d{2}$/.test(date)&&!Number.isNaN(parsed.getTime())&&parsed.toISOString().slice(0,10)===date;
   const review=!validDate?'Informe a data da aquisição.':possibleDuplicate?'Há uma despesa manual na mesma data e com o mesmo valor. Confira antes de incluir.':'';
   const category=upper(product?.category);
   result.push({
    id:`estoque:${type}:${record.id}`,stockOrigin:type,stockOriginId:record.id,
    description:product?.name||'PRODUTO NÃO LOCALIZADO',date,value,
    expenseStatus:record.expenseStatus,expensePaidDate:record.expensePaidDate,
    category:category===cageCategory?cageCategory:category===grainStockCategory?'ALIMENTAÇÃO — SEMENTES':category===produceStockCategory?'ALIMENTAÇÃO — LEGUMES, INFLORESCÊNCIAS E FRUTAS':'OUTROS',
    quantity:type==='stock'?stockAcquisitionQuantity(record):Number(record.quantity),unit:product?.unit||'',
    review
   });
  }
 }
 return result;
}

function prepareStockSave(type,record,old,form){
 for(const key of ['quantity','acquisitionQuantity','cost','unitCost']){
  if(form.elements[key]?.dataset?.stockDecimal&&!Number.isFinite(record[key])&&!form.elements[key].disabled)return 'Informe um valor numérico válido.';
 }
 if(type==='movements'&&!(record.quantity>0))return 'Informe uma quantidade maior que zero.';
 if(type==='stock'){
  if(!stockProducts(record.category,old).includes(record.name))return 'SELECIONE UM PRODUTO DA CATEGORIA.';
  if(!old&&!stockCatalog.has(record.category))return 'SELECIONE A CATEGORIA.';
  if(cageProduct(record)){
   if(!Number.isSafeInteger(record.quantity))return 'Informe a quantidade de gaiolas em unidades inteiras.';
   if(old&&record.quantity<stockReserved(old.id))return 'O saldo não pode ficar abaixo das unidades reservadas para entrega.';
   record.unit='UN';
  }
  if(old&&!cageProduct(record)&&(cageUnits(old.id).length||db.revenues.some(r=>r.kind==='cage'&&r.itemId===old.id)))return 'Mantenha a categoria Gaiolas para preservar o histórico de vendas.';
  if(old&&upper(old.category)===record.category&&upper(old.name)===record.name){
   record.category=old.category;
   record.name=old.name;
  }
  if(form.elements.acquisitionQuantity.value===''){
   record.acquisitionQuantity=old?stockAcquisitionQuantity(old):record.quantity;
  }
 }
 if(type==='movements'&&cageProduct(getRecord('stock',record.stock))&&!Number.isSafeInteger(record.quantity))return 'Informe a quantidade de gaiolas em unidades inteiras.';
 if(type==='movements'&&!['ENTRADA','SAÍDA'].includes(record.type))return 'SELECIONE O TIPO DE MOVIMENTAÇÃO.';
 if(type==='movements'&&record.type==='SAÍDA'){
  record.cost=0;
  record.unitCost=0;
 }
 if(record.cost>0||record.unitCost>0){
  if(!record.date)return 'INFORME A DATA DA AQUISIÇÃO PARA REGISTRAR A DESPESA.';
  if(record.unitCost>0&&!record.cost&&!(Number(type==='stock'?record.acquisitionQuantity:record.quantity)>0)){
   return 'INFORME A QUANTIDADE ADQUIRIDA PARA CALCULAR O TOTAL.';
  }
  if(!stockExpenseValue(type,record))return 'INFORME UM CUSTO TOTAL VÁLIDO DE PELO MENOS R$ 0,01.';
 }
 const key=stockExpenseKey(record.date,stockExpenseValue(type,record));
 const samePurchase=old&&stockExpenseKey(old.date,stockExpenseValue(type,old))===key;
 const manualMatch=db.expenses.some(e=>!e.birdAcquisitionId&&stockExpenseKey(e.date,e.value)===key);
 record.stockExpenseConfirmed=samePurchase&&old.stockExpenseConfirmed===true
  ||samePurchase&&form.elements.stockExpenseConfirmed?.checked===true
  ||!manualMatch;
 return '';
}

function checkCycle(candidate,relative,birds){let visited=new Set();function walk(x){if(!x||visited.has(x))return false;if(sameId(x,candidate))return true;visited.add(x);const b=birds.find(z=>sameId(z.id,x));return b?walk(b.father)||walk(b.mother):false}return walk(relative)}

function validate(type,r,current){if(type==='birds'){if(!r.scientific.trim())return 'O NOME CIENTÍFICO É OBRIGATÓRIO.';if(r.ring&&db.birds.some(b=>b.id!==current&&upper(b.ring)===upper(r.ring)))return 'ESSA ANILHA JÁ ESTÁ CADASTRADA.';if(current&&(r.father===current||r.mother===current))return 'A AVE NÃO PODE SER SEU PRÓPRIO PAI OU MÃE.';if(r.father&&sexValue(findBird(r.father)?.sex)!=='MACHO')return parentError(r.father,'PAI','MACHO');if(r.mother&&sexValue(findBird(r.mother)?.sex)!=='FÊMEA')return parentError(r.mother,'MÃE','FÊMEA');const candidates=db.birds.map(b=>b.id===current?{...b,...r}:b);if(checkCycle(current,r.father,candidates)||checkCycle(current,r.mother,candidates))return 'VÍNCULO GENEALÓGICO CIRCULAR NÃO PERMITIDO.'}
if(type==='couples'){if(!r.male||!r.female||r.male===r.female)return 'SELECIONE UM MACHO E UMA FÊMEA DIFERENTES.';if(findBird(r.male)?.scientific!==findBird(r.female)?.scientific)return 'NÃO É PERMITIDO FORMAR CASAL ENTRE ESPÉCIES DIFERENTES.'}

if(type==='movements'){const s=db.stock.find(s=>s.id===r.stock);if(!s)return 'SELECIONE UM PRODUTO.';const previous=db.movements.find(x=>x.id===current);const reversed=previous&&previous.stock===r.stock?(previous.type==='ENTRADA'?-Number(previous.quantity):Number(previous.quantity)):0;const delta=r.type==='ENTRADA'?Number(r.quantity):-Number(r.quantity);if(Number(s.quantity)+reversed+delta<stockReserved(s.id))return 'SALDO DISPONÍVEL INSUFICIENTE PARA ESTA MOVIMENTAÇÃO.';if(previous&&previous.stock!==r.stock){const p=db.stock.find(x=>x.id===previous.stock);if(p&&Number(p.quantity)+(previous.type==='ENTRADA'?-Number(previous.quantity):Number(previous.quantity))<stockReserved(p.id))return 'A TRANSFERÊNCIA DE MOVIMENTAÇÃO GERARIA SALDO NEGATIVO NO PRODUTO ANTERIOR.'}}

  }

function validateFacilityChange(type,record,old){

 if(type!=='transfers')return '';

 if(!unit?.cageStockId)return '';

  return 'Selecione uma gaiola disponível para registrar a ocupação.';
 }

  (!t.end||record.start<t.end)&&(!record.end||t.start<record.end));
 if(overlap)return 'Esta gaiola individual já tem uma ocupação no período informado.';
 return '';
}

commitImport=function(){const before=JSON.stringify(db);let added=0,duplicates=0,review=0;const errors=[];for(const check of document.querySelectorAll('[data-import-row]:checked')){const i=Number(check.dataset.importRow),r={};document.querySelectorAll('[data-row="'+i+'"]').forEach(el=>r[el.dataset.importKey]=el.value.trim());const birth=parseBRDate(r.birthDate||'');if(!r.scientific||!r.ring||birth===null){review++;errors.push('Linha '+(i+1)+': confira espécie, código e nascimento.');continue}const sx=sexValue(r.sex);if(r.sex&&sx==='NÃO IDENTIFICADO'&&!['NÃO IDENTIFICADO','DESCONHECIDO'].includes(upper(r.sex))){review++;errors.push('Linha '+(i+1)+': sexo incerto.');continue}if(db.birds.some(b=>upper(b.ring||'').replace(/\s/g,'')===upper(r.ring).replace(/\s/g,''))){duplicates++;continue}if([['status',db.settings.statuses],['condition',db.settings.conditions]].some(([k,list])=>r[k]&&!list.some(x=>upper(x)===upper(r[k])))){review++;errors.push('Linha '+(i+1)+': situação ou condição não cadastrada.');continue}db.birds.push({...r,birthDate:birth,sex:sx,father:'',mother:'',id:id(),createdAt:new Date().toISOString(),importSource:'PDF revisado',sourceMetadata:{commonName:importRows[i]?.commonName||'',reviewedAt:new Date().toISOString()}});added++}if(added&&!persist('birds','IMPORTAR PDF',{count:added})){db=JSON.parse(before);return document.getElementById('importResult').textContent='Falha ao salvar. Nenhum registro mantido.'}render();document.getElementById('importResult').textContent=`Importadas: ${added}. Já cadastradas: ${duplicates}. Revisão: ${review}. ${errors.join(' ')}`};
function normalized(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function structuredBirdRows(words){const lines=[];for(const w of words.slice().sort((a,b)=>a.y-b.y||a.x-b.x)){let l=lines.find(l=>Math.abs(l.y-(w.y+w.h/2))<Math.max(6,w.h*.55));if(!l){l={y:w.y+w.h/2,items:[]};lines.push(l)}l.items.push(w)}let columns=null;const result=[];for(const l of lines){l.items.sort((a,b)=>a.x-b.x);const txt=normalized(l.items.map(x=>x.text).join(' '));if(txt.includes('sexo')&&txt.includes('nascimento')){const specs=[['scientific','cient'],['commonName','comum'],['sex','sexo'],['birthDate','nascimento'],['ringType','tipo'],['ringDiameter','diam'],['ring','digo']];columns=specs.map(([key,token])=>{const index=l.items.findIndex(w=>normalized(w.text).includes(token));if(index<0)return null;const word=l.items[index];return {key,x:word.x,right:word.x+word.w}});if(columns.some(x=>!x)){columns=null;continue}columns.forEach((c,i)=>c.left=i?(columns[i-1].right+c.x)/2:-Infinity);continue}if(!columns)continue;if(/aten[cç]|observa/.test(txt))break;const cells={};for(const w of l.items){const c=columns.slice().reverse().find(c=>w.x+w.w/2>=c.left);if(c)cells[c.key]=(cells[c.key]?cells[c.key]+' ':'')+w.text}if(cells.scientific)cells.scientific=cells.scientific.replace(/^\d+\s+/,'');if(cells.scientific&&/^[A-Za-z]+\s+[a-z]+/.test(cells.scientific)&&cells.ring&&(/\d{2}\/\d{2}\/\d{4}/.test(cells.birthDate||'')||/anilha/i.test(cells.ringType||''))){cells.birthDate=parseBRDate((cells.birthDate||'').replace(/\s/g,''))||'';const sex=sexValue(cells.sex);cells.review=sex==='NÃO IDENTIFICADO'?'Sexo não reconhecido; confira a imagem.':'Conferir OCR antes de salvar.';cells.sex=sex==='NÃO IDENTIFICADO'?'':sex;result.push(cells)}}return result}
parseIbamaRows=function(text){const result=[];const lines=text.split(/\r?\n/);for(let i=0;i<lines.length;i++){let line=lines[i].replace(/\|/g,' ').trim();if(!/^(?:\d+\s+)?[A-Z][a-z]+\s+[a-z]+\b/.test(line))continue;while(i+1<lines.length&&/^\s*[\d.,]+(?:\s+\d+)?\s*$/.test(lines[i+1]))line+=' '+lines[++i].trim();const m=line.match(/^(?:\d+\s+)?([A-Z][a-z]+\s+[a-z]+)\s+(.*?)\s+([^\s]+)\s+(\d{2}\/\d{2}\/\d{4})\s+(anilha\s*(?:fechada|aberta))\s*(.*)$/i);if(!m)continue;let tail=m[6].trim(),diam='';const dm=tail.match(/^([\d.,]+)\s+/);if(dm){diam=dm[1];tail=tail.slice(dm[0].length)}if(!tail)continue;const sx=sexValue(m[3]);result.push({scientific:m[1],commonName:m[2],sex:sx==='NÃO IDENTIFICADO'?'':sx,birthDate:parseBRDate(m[4])||'',ringType:m[5].replace(/^anilha\s*/i,'anilha '),ringDiameter:diam,ring:tail,review:sx==='NÃO IDENTIFICADO'?'Sexo incerto: '+m[3]+'. Confira também o diâmetro.':'Conferir espécie e código de anilha.'})}return result};
readBirdPDF=async function(file){if(!file)return;const status=document.getElementById('pdfProgress');try{status.textContent='Lendo documento…';await loadLib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',()=>window.pdfjsLib);pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let rows=[],raw='';for(let n=1;n<=pdf.numPages;n++){status.textContent=`Analisando página ${n}/${pdf.numPages}…`;const page=await pdf.getPage(n),tc=await page.getTextContent(),text=tc.items.map(x=>x.str).join(' ');let words,pageText;if(unusablePDFText(text)){await loadLib('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',()=>window.Tesseract);const vp=page.getViewport({scale:3}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;status.textContent=`Reconhecendo colunas por OCR: página ${n}…`;const ocr=await Tesseract.recognize(canvas,'por');pageText=ocr.data.text;words=(ocr.data.words||[]).map(w=>({text:w.text,x:w.bbox.x0,y:w.bbox.y0,w:w.bbox.x1-w.bbox.x0,h:w.bbox.y1-w.bbox.y0}))}else{pageText=text;words=tc.items.map(x=>({text:x.str,x:x.transform[4],y:-x.transform[5],w:x.width,h:x.height||10}))}let found=structuredBirdRows(words);if(!found.length)found=parseIbamaRows(pageText);rows.push(...found);raw+=pageText+'\n'}if(rows.length){showBirdPreview(rows);status.textContent=`${rows.length} ave(s) identificada(s). Confira e confirme para salvar.`}else{status.textContent='Não foi possível identificar com segurança as colunas. Cole uma ave por linha abaixo, separando os campos por |.';document.getElementById('pdfReview').innerHTML='<p>Ordem: nome científico | nome individual | sexo | nascimento | tipo de anilha | diâmetro | código de anilha | situação | condição</p><textarea id="pdfText" style="width:100%;min-height:180px"></textarea><button class="btn" onclick="showBirdPreview(document.getElementById(\'pdfText\').value.split(/\\n/).filter(x=>x.trim()).map(line=>Object.fromEntries(importFields.map(([k],i)=>[k,line.split(\'|\')[i]?.trim()||\'\']))))">Preparar prévia manual</button>';document.getElementById('pdfText').value=raw}}catch(e){status.textContent='Erro ao ler: '+e.message}};
// Uma linha por série; registros sem série permanecem individuais.
function taskGroups(){const groups=new Map();for(const t of db.tasks){const key=t.seriesId?'series:'+t.seriesId:'task:'+t.id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(t)}return [...groups.values()].map(g=>g.sort((a,b)=>a.date.localeCompare(b.date)))}
const genericBeforeGroups=generic;generic=function(type){if(type!=='tasks')return genericBeforeGroups(type);const day=new Date().toLocaleDateString('en-CA',{timeZone:db.settings.timezone||'America/Fortaleza'});return header('Rotinas de manejo','Uma linha por rotina. As ocorrências ficam em Ver datas.','Nova rotina','new:tasks')+table(['Atividade','Aves','Intervalo','Próxima pendente','Pendentes / atrasadas','Ações'],taskGroups().map(g=>{const t=g[0],pending=g.filter(x=>!['CONCLUÍDA','CANCELADA'].includes(x.status)),next=pending[0],ref=next||t;return [esc(t.name),String(new Set(g.flatMap(x=>birdIds(x.bird))).size),t.intervalDays?`A cada ${t.intervalDays} dias`:'Individual',next?fmtDate(next.date):'Sem pendências',`${pending.length} / ${pending.filter(x=>x.date<day).length}`,`<button class="btn small secondary" data-series-view="${esc(t.id)}">Ver datas</button> <button class="btn small secondary" data-edit="tasks" data-id="${esc(ref.id)}">Editar rotina</button> ${next?`<button class="btn small" data-series-complete="${esc(next.id)}">Concluir ${fmtDate(next.date)}</button> <button class="btn small danger" data-series-cancel="${esc(t.id)}">Cancelar próximas</button>`:''}`]}))};
function showTaskDates(idValue,month=''){const t=getRecord('tasks',idValue);if(!t)return;const all=db.tasks.filter(x=>t.seriesId?x.seriesId===t.seriesId:x.id===t.id).sort((a,b)=>a.date.localeCompare(b.date));const selected=month||all.find(x=>!['CONCLUÍDA','CANCELADA'].includes(x.status))?.date.slice(0,7)||all[0].date.slice(0,7);modal('Datas da rotina: '+t.name,`<label>Mês <input type="month" value="${esc(selected)}" data-series-month="${esc(t.id)}"></label>`+table(['Data','Situação','Ação'],all.filter(x=>x.date.startsWith(selected)).map(x=>[fmtDate(x.date),esc(x.status||'PENDENTE'),`<button class="btn small secondary" data-edit="tasks" data-id="${esc(x.id)}">Editar ocorrência</button> ${!['CONCLUÍDA','CANCELADA'].includes(x.status)?`<button class="btn small" data-series-complete="${esc(x.id)}">Concluir ${fmtDate(x.date)}</button>`:''}`])))}
document.addEventListener('change',e=>{if(e.target.dataset.seriesMonth)showTaskDates(e.target.dataset.seriesMonth,e.target.value)});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.seriesView)return showTaskDates(b.dataset.seriesView);if(b.dataset.seriesComplete){const t=getRecord('tasks',b.dataset.seriesComplete);if(!t||['CONCLUÍDA','CANCELADA'].includes(t.status)||!confirm('Confirmar execução de '+t.name+' prevista para '+fmtDate(t.date)+'?'))return;const previous=JSON.stringify(db);t.status='CONCLUÍDA';t.completedAt=new Date().toISOString();t.done=new Date().toLocaleDateString('en-CA',{timeZone:db.settings.timezone||'America/Fortaleza'});if(!persist('tasks','CONCLUIR',t)){db=JSON.parse(previous);return}closeModal();render()}if(b.dataset.seriesCancel){const t=getRecord('tasks',b.dataset.seriesCancel),day=new Date().toLocaleDateString('en-CA',{timeZone:db.settings.timezone||'America/Fortaleza'});const rows=db.tasks.filter(x=>(t.seriesId?x.seriesId===t.seriesId:x.id===t.id)&&x.date>=day&&!['CONCLUÍDA','CANCELADA'].includes(x.status));if(!rows.length)return toast('SEM OCORRÊNCIAS FUTURAS PENDENTES.');if(!confirm('Cancelar '+rows.length+' ocorrências a partir de hoje? Atrasadas e concluídas serão preservadas.'))return;const previous=JSON.stringify(db);rows.forEach(x=>{x.status='CANCELADA';x.updatedAt=new Date().toISOString()});if(!persist('tasks','CANCELAR PRÓXIMAS',t)){db=JSON.parse(previous);return}render()}});

function completeRingDiameter(row){if(String(row.ringDiameter||'').trim())return row;const match=String(row.ring||'').match(/^IBAMA\s+OA\s+(\d+[,.]\d+)\s+\d+$/i);if(!match)return row;return {...row,ringDiameter:match[1],diameterSource:'Código IBAMA OA — conferir com a coluna Diâm. do PDF',review:[row.review,'Diâmetro recuperado do código IBAMA OA; confira a coluna Diâm. do PDF.'].filter(Boolean).join(' ')}}
const previewBeforeDiameter=showBirdPreview;
showBirdPreview=function(rows){return previewBeforeDiameter(rows.map(completeRingDiameter))};

function speciesPhoto(s){return s&&SPECIES_PHOTOS[normalizeSpecies(s.scientific)]||null}
function matchedBirdSpecies(b){const value=normalizeSpecies(b?.scientific||b?.scientificName||b?.species);return [...SPECIES_CATALOG,...(db.settings.speciesCustom||[])].find(x=>[x.scientific,...(x.synonyms||[])].some(y=>normalizeSpecies(y)===value))||null}
function photoData(value){return typeof value==='string'&&/^data:image\/(?:webp|jpeg);base64,[A-Za-z0-9+/]+={0,2}$/.test(value)?value:''}
function customSpeciesPhoto(s){return s?photoData(db.settings.speciesPhotos?.[s.id]):''}
function speciesPhotoImg(s,cls='',custom='',loading='lazy',id=''){
 const catalog=speciesPhoto(s);
 const alt=custom?'Foto personalizada':catalog?'Fotografia de '+s.scientific:'Ilustração neutra de ave';
 return `<img class="${cls}" src="${esc(custom||catalog?.url||NEUTRAL_BIRD_IMAGE)}" data-species-photo="1" alt="${esc(alt)}" loading="${loading}" ${id?`id="${id}"`:''}>`;
}
function birdPhotoImg(b,cls){
 const species=matchedBirdSpecies(b);
 return speciesPhotoImg(species,cls,photoData(b.photo)||customSpeciesPhoto(species));
}
function speciesPhotoCredits(list){
 const sources=list.filter(s=>speciesPhoto(s)&&!customSpeciesPhoto(s));
 if(!sources.length)return '';
 return `<details style="margin-top:14px"><summary>Créditos e licenças das fotografias do catálogo</summary><ul>${sources.map(s=>{
  const p=speciesPhoto(s);
  return `<li>${esc(s.common)} — ${esc(p.author)} · ${esc(p.license)} · <a href="${esc(p.page)}" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a></li>`;
 }).join('')}</ul></details>`;
}
document.addEventListener('error',e=>{
 const img=e.target;
 if(!img?.matches?.('img[data-species-photo]')||img.dataset.photoFallback)return;
 img.dataset.photoFallback='1';
 img.src=NEUTRAL_BIRD_IMAGE;
 img.alt='Ilustração neutra de ave';
},true);
let speciesDraft=null, speciesSearch='';
const normalizeSpecies=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const speciesKey=s=>normalizeSpecies(s.scientific).replace(/\s+/g,' ');
function configuredSpecies(){return (db.settings.speciesSelected||[]).map(x=>speciesById(x)).filter(Boolean)}
function speciesById(key){return [...SPECIES_CATALOG,...(db.settings.speciesCustom||[])].find(x=>x.id===key)}
function knownBirdSuggestions(){const values=[...new Set(db.birds.map(b=>String(b.scientific||b.scientificName||b.species||'').trim()).filter(Boolean))];return values.map(raw=>({raw,species:SPECIES_CATALOG.find(s=>[s.scientific,...s.synonyms].some(n=>normalizeSpecies(n)===normalizeSpecies(raw)))}))}
function startSpeciesSetup(force=false){if(!force&&db.settings.setupComplete)return;speciesDraft={selected:[...(db.settings.speciesSelected||[])],featured:db.settings.speciesFeatured||'',custom:(db.settings.speciesCustom||[]).map(x=>({...x})),profile:{owner:db.settings.owner||'',name:db.settings.name==='MEU CRIADOURO'?'':db.settings.name||'',municipality:db.settings.municipality||'',state:db.settings.state||'',phone:db.settings.phone||'',email:db.settings.email||'',environmentalRegistration:db.settings.environmentalRegistration||''},edit:force};speciesSearch='';renderSpeciesSetup()}
function draftSpecies(){return [...SPECIES_CATALOG,...speciesDraft.custom]}
function selectedEntry(key){return draftSpecies().find(s=>s.id===key)}
function speciesOptions(){const q=normalizeSpecies(speciesSearch);return draftSpecies().filter(s=>!q||[s.common,s.scientific,...(s.alternate||[]),...(s.synonyms||[])].some(x=>normalizeSpecies(x).includes(q)))}
function speciesProfileField(key,label,type='text',extra=''){return `<div><label for="setup_${key}">${label}</label><input id="setup_${key}" data-profile="${key}" type="${type}" ${extra} value="${esc(speciesDraft.profile[key]||'')}"></div>`}
function renderSpeciesSetup(preserveSearch=false){if(!speciesDraft)return;
 const entries=draftSpecies(), selected=speciesDraft.selected.map(selectedEntry).filter(Boolean);
 const body=`<div class="welcome-screen"><div class="welcome-card"><div class="welcome-head"><div style="font-size:12px;letter-spacing:2px">CANTO & NINHO · CONFIGURAÇÃO DO CRIADOURO</div><h2>${speciesDraft.edit?'Meu criadouro':'Bem-vindo ao Canto & Ninho!'}</h2><p>Selecione as espécies do seu criadouro e personalize sua experiência. Os dados do responsável são opcionais.</p></div><div class="welcome-body"><div class="setup-columns"><section class="setup-section"><h3>1. Dados do responsável <span class="muted">(opcionais)</span></h3><p class="muted">Você pode continuar sem preencher e editar depois em Configurações → Meu criadouro. Nada aqui ativa mensagens ou notificações.</p><div class="setup-grid">${speciesProfileField('owner','Nome do responsável')}${speciesProfileField('name','Nome do criadouro')}${speciesProfileField('municipality','Município')}${speciesProfileField('state','Estado / UF','text','maxlength="2" placeholder="UF"')}${speciesProfileField('phone','Telefone / WhatsApp','tel')}${speciesProfileField('email','E-mail','email')}${speciesProfileField('environmentalRegistration','Registro no órgão ambiental (se houver)')}</div></section><section class="setup-section"><h3>2. Espécies criadas <span style="color:#a25b38">*</span></h3><p class="muted">Selecione pelo menos uma espécie. A escolha não cria aves no plantel e não representa autorização ambiental.</p><input class="field" style="width:100%;margin:8px 0" id="speciesSearch" placeholder="Buscar nome comum, científico ou sinônimo" value="${esc(speciesSearch)}" aria-label="Pesquisar espécies"><div class="species-list" id="speciesResults">${renderSpeciesResults()}</div><div style="margin-top:12px"><strong style="font-size:12px">Selecionadas (${selected.length})</strong><div id="selectedSpeciesChips">${selected.length?selected.map(x=>`<span class="species-chip">${esc(x.common)} <button data-species-remove="${esc(x.id)}" aria-label="Remover ${esc(x.common)}">×</button></span>`).join(''):'<p class="muted">Nenhuma espécie selecionada.</p>'}</div></div><div class="species-unknown"><button class="btn secondary small" data-species-unknown="toggle" type="button">Não encontrei a espécie</button><div id="speciesUnknownFields" hidden style="margin-top:10px"><p class="muted">Cadastro provisório para revisão taxonômica, não validado pelo catálogo.</p><div class="setup-grid"><div><label for="newSpeciesCommon">Nome comum</label><input class="field" id="newSpeciesCommon" style="width:100%"></div><div><label for="newSpeciesScientific">Nome científico informado</label><input class="field" id="newSpeciesScientific" style="width:100%"></div></div><button class="btn small" data-species-add-custom="1" type="button" style="margin-top:8px">Adicionar para revisão</button></div></div><div style="margin-top:15px"><h3>Espécie de destaque</h3><p class="muted">${selected.length>1?'Escolha uma espécie para o banner inicial.':'Com apenas uma espécie, ela será destacada automaticamente.'}</p><div id="speciesHighlightChoices">${selected.map(s=>`<label class="species-highlight"><input type="radio" name="featuredSpecies" value="${esc(s.id)}" ${speciesDraft.featured===s.id?'checked':''} ${selected.length===1?'disabled':''}><span>${esc(s.common)} — <i>${esc(s.scientific)}</i></span></label>`).join('')}</div></div><div id="speciesPreview">${renderSpeciesPreview()}</div></section></div><div class="notice info">Os créditos das fotografias do catálogo estão em Configurações. Quando a fotografia estiver indisponível, aparece uma ilustração neutra. O catálogo não certifica a regularidade da criação. Fontes: diagnóstico IBAMA/SisPass e Lista das Aves do Brasil (CBRO). Consulta em 12/11/2026.</div>${renderExistingBirdSuggestions()}<div class="setup-bottom"><div class="backup-import-card"><h3>Já possui um backup do Canto &amp; Ninho?</h3><p>Importe um arquivo JSON de um dispositivo anterior antes de concluir a configuração inicial. Nada será substituído antes da sua confirmação.</p><button class="btn secondary" type="button" data-backup-choose="1">↑ Importar backup existente</button></div><div class="setup-error" id="speciesError" role="alert"></div><div class="actions">${speciesDraft.edit?'<button type="button" class="btn secondary" data-species-cancel="1">Cancelar</button>':''}<button type="button" class="btn" data-species-save="1">${speciesDraft.edit?'Salvar alterações':'Salvar e começar'}</button></div></div></div></div></div>`;
 document.getElementById('welcomeRoot').innerHTML=body;
 if(preserveSearch){const el=document.getElementById('speciesSearch');el.focus();el.setSelectionRange(el.value.length,el.value.length)} }
function renderSpeciesResults(){return speciesOptions().map(s=>`<button class="species-option ${speciesDraft.selected.includes(s.id)?'selected':''}" data-species-toggle="${esc(s.id)}" type="button"><span class="tick">${speciesDraft.selected.includes(s.id)?'✓':'+'}</span>${speciesPhotoImg(s,'species-thumb',customSpeciesPhoto(s))}<span><strong>${esc(s.common)}</strong> — <i>${esc(s.scientific)}</i>${s.review?'<small> · EM REVISÃO</small>':''}</span></button>`).join('')||'<p class="muted" style="padding:10px">Nenhuma correspondência. Use “Não encontrei a espécie”.</p>'}
function renderSpeciesPreview(){const s=selectedEntry(speciesDraft.featured);return `<div class="species-preview">${speciesPhotoImg(s,'species-preview-photo',customSpeciesPhoto(s))}<div><strong>Prévia do banner</strong></div></div>`}
function renderExistingBirdSuggestions(){const suggestions=knownBirdSuggestions();if(!suggestions.length)return '';return `<div class="notice"><strong>Espécies encontradas no plantel existente (conferir manualmente)</strong><div style="margin-top:7px">${suggestions.map(v=>v.species?`<button class="btn secondary small" style="margin:3px" type="button" data-species-suggest="${esc(v.species.id)}">+ ${esc(v.species.common)} (${esc(v.raw)})</button>`:`<span class="species-chip">${esc(v.raw)} · SEM CORRESPONDÊNCIA VERIFICADA</span>`).join('')}</div><div class="muted">Aves existentes não serão modificadas; as sugestões não são selecionadas automaticamente.</div></div>`}

async function preparePhoto(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Escolha uma imagem JPG, PNG ou WebP.');
 let image;
 try{image=await createImageBitmap(file)}catch{throw Error('Não foi possível abrir essa imagem. Escolha outro arquivo.')}
 try{
  const canvas=document.createElement('canvas');
  const longest=Math.max(image.width,image.height);
  for(const side of [720,540,360,240]){
   const scale=Math.min(1,side/longest);
   canvas.width=Math.max(1,Math.round(image.width*scale));
   canvas.height=Math.max(1,Math.round(image.height*scale));
   canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL('image/webp',0.8);
   if(data.length<=75000&&photoData(data))return data;
  }
  throw Error('Não foi possível reduzir a imagem. Escolha um arquivo menor.');
 }finally{image.close()}
}

function savePhoto(kind,key,expected,data,error){

 if((!bird&&!species)||(bird?photoData(previous):customSpeciesPhoto(species))!==expected){
  error.textContent='A foto ou o cadastro mudou. Feche esta janela e tente novamente.';

 }

  if(data)bird.photo=data;else delete bird.photo;
 }else{
  const photos={...previous};

const CLOUD_META_KEY=KEY+'_cloud_meta_v2';
function readCloudMeta(){try{return JSON.parse(localStorage.getItem(CLOUD_META_KEY))||null}catch{return null}}
const cloudState={token:sessionStorage.getItem('canto_cloud_token')||'',revision:null,ready:false,pending:false,busy:false,sequence:0,timer:null,conflict:false,meta:readCloudMeta(),retry:0,checking:false,reading:false,importing:false,needsLogin:false};

function markCloudMeta(revision,dirty=false,localOnly=cloudState.meta?.localOnly===true){
 const meta={revision,dirty,at:new Date().toISOString(),...(localOnly?{localOnly:true}:{})};
 try{localStorage.setItem(CLOUD_META_KEY,JSON.stringify(meta));cloudState.meta=meta;return true}
 catch(e){console.warn('Não foi possível registrar estado de sincronização',e);return false}
}
const realLocalSave=save;
save=function(...args){

 if(previousMeta&&!previousMeta.dirty&&!markCloudMeta(previousMeta.revision,true)){
  toast('Sem espaço para proteger as alterações locais. Exporte um backup.');
  return false;
 }
 if(!realLocalSave(...args)){
  if(previousMeta&&!previousMeta.dirty)markCloudMeta(previousMeta.revision,false);
  return false;
 }
 cloudState.sequence++;
 cloudState.pending=true;
 if(cloudState.ready&&!cloudState.conflict)cloudSchedule();

};

async function cloudAPI(path,method='GET',body=null,token=cloudState.token){const res=await fetch(path,{method,credentials:'same-origin',headers:{...(body?{'content-type':'application/json'}:{}),...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});let data;try{data=await res.json()}catch{throw Error('API da Cloudflare não respondeu com JSON.')}if(!res.ok){const err=Error(data.error||'Erro HTTP '+res.status);err.status=res.status;throw err}return data}

function cloudLocalSafetyCopy(){

function cloudAdopt(data){

 const baseline=defaultDB();
 const next={...baseline,...data,settings:{...baseline.settings,...data.settings}};
 localStorage.setItem(KEY,JSON.stringify(next));

 cloudState.sequence++;
 speciesDraft=null;
 document.getElementById('welcomeRoot').innerHTML='';

}
function cloudReady(revision){
 cloudState.revision=revision;
 cloudState.ready=true;
 cloudState.needsLogin=false;
 cloudState.conflict=false;

}
function cloudConflict(){

}
function cloudCanAdopt(sequence){

}
async function cloudInitialize(){
 if(cloudState.checking||cloudState.reading||cloudState.busy||cloudState.importing||cloudState.conflict)return;
 if(cloudState.meta?.localOnly){cloudStatus('Backup restaurado · salvo neste aparelho');return}
 cloudState.checking=true;
 const sequence=cloudState.sequence;
 cloudStatus('Verificando nuvem…');
 try{
  const out=await cloudAPI('/api/data');
  if(!cloudCanAdopt(sequence)){cloudStatus('Salvo neste aparelho · verificação pendente');return}
  const meta=cloudState.meta;
  cloudState.revision=out.revision;
  if(!out.data){
   if(!hasRealRecords(db)){cloudReady(out.revision);return}
   if(!confirm('A nuvem está vazia. Deseja enviar os registros deste aparelho?')){
    cloudState.ready=false;
    cloudStatus('Salvo neste aparelho · envio aguardando confirmação');
    return;
   }
   cloudLocalSafetyCopy();
   cloudState.ready=true;
   cloudState.pending=true;
   await cloudUpload();
   return;
  }
  const identical=JSON.stringify(out.data)===JSON.stringify(db);
  if(!identical){
   if(meta?.dirty){
    if(meta.revision!==out.revision){cloudConflict();return}
    cloudState.ready=true;
    cloudState.pending=true;
    await cloudUpload();
    return;
   }
   if(hasRealRecords(db)){
    if(!meta&&!confirm('Foram encontrados registros neste aparelho e na nuvem. Deseja carregar os registros da nuvem e guardar uma cópia local de segurança?')){
     cloudState.ready=false;
     cloudStatus('Salvo neste aparelho · confira a versão da nuvem');
     return;
    }
    cloudLocalSafetyCopy();
   }
   cloudAdopt(out.data);
  }
  cloudReady(out.revision);
 }catch(e){
  cloudState.ready=false;
  if(e.status===401)cloudNeedsLogin();
  else{
   cloudStatus(navigator.onLine?'Salvo neste aparelho · nuvem indisponível':'Offline · salvo neste aparelho');
   console.warn('Não foi possível iniciar a sincronização',e);
  }
 }finally{cloudState.checking=false}
}
function cloudSchedule(delay=1100){clearTimeout(cloudState.timer);if(!navigator.onLine){cloudStatus('Offline · aguardando envio');return}cloudStatus('Salvo neste aparelho · aguardando envio');cloudState.timer=setTimeout(()=>cloudUpload(),delay)}
async function cloudUpload(){if(!cloudState.ready||cloudState.revision===null||cloudState.conflict||cloudState.busy||cloudState.importing||!navigator.onLine)return;cloudState.busy=true;clearTimeout(cloudState.timer);const sequence=cloudState.sequence,snapshot=JSON.parse(JSON.stringify(db));cloudStatus('Sincronizando…');try{
 const result=await cloudAPI('/api/data','PUT',{revision:cloudState.revision,data:snapshot});cloudState.revision=result.revision;cloudState.retry=0;cloudState.pending=sequence!==cloudState.sequence;const recorded=markCloudMeta(result.revision,cloudState.pending);
 cloudStatus(cloudState.pending?'Salvo neste aparelho · aguardando envio':recorded?'Sincronizado':'Dados salvos · confira a sincronização',recorded&&!cloudState.pending?'synced':'');
 }catch(e){cloudState.pending=true;markCloudMeta(cloudState.revision,true);if(e.status===409){cloudConflict()}else if(e.status===401){cloudNeedsLogin('Sessão expirada · alterações neste aparelho')}else if(e.status===413){cloudState.ready=false;cloudStatus('Salvo neste aparelho · limite da nuvem atingido')}else{cloudState.retry++;cloudStatus('Salvo neste aparelho · envio pendente');console.warn('Sincronização pendente',e.message)}}finally{cloudState.busy=false;if(cloudState.ready&&cloudState.pending&&!cloudState.conflict&&navigator.onLine)cloudSchedule(Math.min(60000,cloudState.retry?5000*Math.pow(2,Math.min(4,cloudState.retry-1)):1200))}}
async function cloudRefresh(){
 if(!cloudState.ready||cloudState.busy||cloudState.reading||cloudState.checking||cloudState.importing||cloudState.pending||cloudState.conflict||document.hidden||!navigator.onLine)return;
 cloudState.reading=true;
 const sequence=cloudState.sequence,revision=cloudState.revision;
 try{
  const out=await cloudAPI('/api/data');
  if(!cloudState.ready||cloudState.conflict||cloudState.busy||cloudState.pending||cloudState.revision!==revision||!cloudCanAdopt(sequence))return;
  if(out.revision<=revision)return;
  if(hasRealRecords(db))cloudLocalSafetyCopy();
  cloudAdopt(out.data);
  cloudReady(out.revision);
 }catch(e){
  if(e.status===401&&cloudState.revision===revision&&!cloudState.busy)cloudNeedsLogin('Sessão expirada · entrar');
  else if(cloudState.sequence===sequence&&!cloudState.pending){
   cloudStatus('Salvo neste aparelho · atualização da nuvem adiada');
   console.warn('Atualização da nuvem adiada',e);
  }
 }finally{cloudState.reading=false}
}
async function cloudRecover(){
 if(cloudState.reading||cloudState.checking||cloudState.busy||cloudState.importing)return;
 if(!confirm('Carregar a versão da nuvem neste aparelho? Uma cópia de segurança dos registros locais será mantida.'))return;
 cloudState.reading=true;
 const sequence=cloudState.sequence;
 try{
  const remote=await cloudAPI('/api/data');
  if(!cloudCanAdopt(sequence)||!cloudState.conflict)return toast('Os registros locais mudaram. Confira antes de carregar a nuvem.');
  if(!remote.data)return toast('A nuvem não contém registros para restaurar.');
  cloudLocalSafetyCopy();
  cloudAdopt(remote.data);
  cloudReady(remote.revision);
  cloudClose();
  toast('Versão da nuvem carregada. Cópia local preservada.');
 }catch(e){toast('Não foi possível carregar a nuvem. Os registros locais foram preservados.')}
 finally{cloudState.reading=false}
}

// IMPORTAÇÃO SEGURA DE BACKUP — preserva os módulos e a chave de armazenamento existentes.
const BACKUP_IMPORT_LIMIT=10*1024*1024;
let backupCandidate=null;
const backupImportInput=document.createElement('input');backupImportInput.type='file';backupImportInput.accept='.json,application/json';backupImportInput.hidden=true;backupImportInput.id='backupImportGlobal';document.body.appendChild(backupImportInput);
const backupImportRoot=document.createElement('div');backupImportRoot.id='backupImportRoot';document.body.appendChild(backupImportRoot);
function beginBackupImport(){backupImportInput.value='';backupImportInput.click()}
function validRecordCollections(data){
 return collections.every(col=>(col==='revenues'&&data[col]===undefined)||Array.isArray(data[col]));
}
function validateBackupObject(obj){
 if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error('O arquivo não contém um backup JSON válido.');
 // Compatível com a exportação nativa do aplicativo (objeto direto, versão 4).
 if(obj.version!==4)throw Error('Versão de backup incompatível. Esta versão importa apenas backups JSON v4 do Canto & Ninho/Caboclinho Manager.');
 if(!obj.settings||typeof obj.settings!=='object'||Array.isArray(obj.settings))throw Error('O backup não contém configurações válidas.');
 for(const col of collections){if(col==='revenues'&&obj[col]===undefined)continue;if(!Array.isArray(obj[col]))throw Error('Coleção obrigatória ausente ou inválida: '+col);if(obj[col].length>100000)throw Error('Quantidade excessiva de registros em '+col);const ids=new Set();for(const item of obj[col]){if(!item||typeof item!=='object'||Array.isArray(item)||typeof item.id!=='string'||!item.id.trim())throw Error('Registro sem identificador válido em '+col);if(ids.has(item.id))throw Error('Identificador duplicado em '+col);ids.add(item.id)}}
 if(obj.audit!==undefined&&!Array.isArray(obj.audit))throw Error('Histórico de alterações inválido.');
 if(obj.settings.speciesSelected!==undefined&&!Array.isArray(obj.settings.speciesSelected))throw Error('Lista de espécies inválida.');
 if(obj.settings.speciesCustom!==undefined&&!Array.isArray(obj.settings.speciesCustom))throw Error('Catálogo personalizado inválido.');
 const base=defaultDB();return {...base,...obj,settings:{...base.settings,...obj.settings}};
}
function backupSummary(data){const counts=collections.map(c=>({label:({birds:'Aves',food:'Alimentos',feedings:'Alimentações',couples:'Casais',eggs:'Ovos',chicks:'Filhotes',tasks:'Manejo',health:'Saúde',expenses:'Despesas',revenues:'Receitas',documents:'Documentos'})[c]||c,count:data[c].length}));return {total:counts.reduce((a,v)=>a+v.count,0),counts};}
function safetyDownload(data,kind){const file='canto-ninho-'+kind+'-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';download(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),file)}
function closeBackupImport(){backupImportRoot.innerHTML='';backupCandidate=null;}
function showBackupImportPreview(data,filename){const current=backupSummary(db),incoming=backupSummary(data);backupCandidate={data,filename};
 const html=`<div class="backup-import-overlay"><section class="backup-import-modal" role="dialog" aria-modal="true" aria-labelledby="backupImportTitle"><h2 id="backupImportTitle">Importar backup</h2><p>Confira os dados antes de restaurar. A importação substituirá os dados <strong>do navegador atual</strong>, nunca mesclará cadastros automaticamente.</p>
 <div class="backup-import-grid"><div><strong>${incoming.total}</strong>Registros no arquivo</div><div><strong>${current.total}</strong>Registros neste navegador</div><div><strong>${incoming.counts.find(x=>x.label==='Aves')?.count||0}</strong>Aves do arquivo</div></div>
 <div class="backup-import-details"><strong>Arquivo:</strong> ${esc(filename)}<br><strong>Criadouro no backup:</strong> ${esc(data.settings.name||'NÃO INFORMADO')}<br><strong>Conteúdo:</strong> ${incoming.counts.filter(x=>x.count).map(x=>esc(x.label)+': '+x.count).join(' · ')||'Sem registros cadastrados'}<br><strong>Estado da configuração:</strong> ${data.settings.setupComplete?'Concluída':'Não concluída'}</div>
 <p><strong>Proteção:</strong> antes de aplicar a substituição, será oferecido um backup JSON dos dados atuais e mantida uma cópia local de segurança. Confirme o arquivo baixado antes de prosseguir.</p>
 <div class="backup-import-actions"><button class="btn secondary" type="button" id="backupCancel">Cancelar</button><button class="btn" type="button" id="backupApplyLocal">Importar neste dispositivo</button>${cloudState.ready?'<button class="btn" type="button" id="backupApplyCloud">Importar e enviar à nuvem</button>':''}</div></section></div>`;
 backupImportRoot.innerHTML=html;
 document.getElementById('backupCancel').onclick=closeBackupImport;
 document.getElementById('backupApplyLocal').onclick=()=>applyBackupImport(false);
 if(cloudState.ready)document.getElementById('backupApplyCloud').onclick=()=>applyBackupImport(true);
}
async function applyBackupImport(toCloud){
 if(!backupCandidate||cloudState.importing)return;
 if(cloudState.busy||cloudState.checking||cloudState.reading)return toast('Aguarde a verificação em andamento para importar.');
 cloudState.importing=true;
 try{await importBackup(toCloud)}
 finally{cloudState.importing=false}
}
async function importBackup(toCloud){if(!backupCandidate)return;const incoming=backupCandidate.data, old=db, initialSequence=cloudState.sequence;
 const previousMeta=cloudState.meta;
 const intro='O backup selecionado substituirá os dados deste dispositivo. Essa ação não faz mesclagem. Deseja continuar?';
 if(!confirm(intro))return;
 // Download explícito e reserva local com chave distinta. Não continuar se a reserva falhar.
 let reserveKey=KEY+'_antes_importacao_'+new Date().toISOString().replace(/\D/g,'');
 try{localStorage.setItem(reserveKey,JSON.stringify(old))}catch(e){alert('Não foi possível criar a cópia local de segurança. Libere espaço ou faça backup manual antes de importar.');return}
 safetyDownload(old,'antes-da-importacao');
 if(!confirm('Confira se o backup de segurança dos dados atuais foi baixado. Confirma a importação?'))return;
 let cloudExpected=null, cloudBefore=null;
 if(toCloud){
  try{const remote=await cloudAPI('/api/data');cloudExpected=remote.revision;cloudBefore=remote.data;
   if(remote.data){safetyDownload(remote.data,'nuvem-antes-da-importacao');if(!confirm('ATENÇÃO: já existem dados na nuvem. Um backup da nuvem foi disponibilizado para download. Confirma SUBSTITUIR os dados da nuvem pelo arquivo importado?'))return;}
   else if(!confirm('A nuvem está vazia. Enviar o backup importado para iniciar seus dados compartilhados?'))return;
  }catch(e){alert('Não foi possível verificar a nuvem. Importação cancelada: '+e.message);return}
 }
 try{
  if(initialSequence!==cloudState.sequence){alert('Os registros locais mudaram durante a importação. Revise o backup e tente novamente.');return}
  clearTimeout(cloudState.timer);
  if(!markCloudMeta(previousMeta?.revision??null,true,!toCloud)){alert('Sem espaço para proteger a importação.');return}
  db=incoming;
  // gravação sem chamar o gatilho de sincronização automática
  if(!realLocalSave()){
   db=old;
   if(previousMeta)markCloudMeta(previousMeta.revision,previousMeta.dirty,previousMeta.localOnly===true);
   else{
    try{localStorage.removeItem(CLOUD_META_KEY);cloudState.meta=null}
    catch(e){console.warn('Estado da importação não pôde ser limpo',e)}
   }
   alert('Importação não concluída: o backup excede o espaço local.');
   return;
  }
  cloudState.sequence++;
  cloudState.pending=true;
  if(toCloud){
    // compare-and-swap: impede sobrescrita se outro dispositivo mudou a nuvem.
    try{
     const sequence=cloudState.sequence;
     const snapshot=structuredClone(incoming);
     const remoteResult=await cloudAPI('/api/data','PUT',{revision:cloudExpected,data:snapshot});
     if(sequence===cloudState.sequence)cloudReady(remoteResult.revision);
     else{
      cloudState.revision=remoteResult.revision;cloudState.ready=true;cloudState.pending=true;
      markCloudMeta(remoteResult.revision,true);cloudSchedule();
     }
    }
    catch(e){cloudState.revision=null;cloudState.ready=false;cloudState.pending=false;markCloudMeta(cloudExpected,true);cloudState.conflict= e.status===409;cloudStatus('Backup apenas local · nuvem não alterada',e.status===409?'conflict':'');alert('O arquivo foi importado apenas neste dispositivo. A nuvem NÃO foi alterada: '+e.message+'\nFaça uma nova cópia local antes de tentar novamente.');}
  }else{
    cloudState.revision=null;cloudState.ready=false;cloudState.pending=true;cloudState.conflict=false;
    cloudStatus('Backup restaurado · salvo neste aparelho');
  }
  closeBackupImport();speciesDraft=null;document.getElementById('welcomeRoot').innerHTML='';nav();render();if(!db.settings.setupComplete)startSpeciesSetup();toast('BACKUP IMPORTADO NESTE DISPOSITIVO.');
 }catch(e){alert('Erro ao concluir a importação. Confira os registros locais antes de tentar novamente: '+e.message)}
}
backupImportInput.addEventListener('change',async()=>{const file=backupImportInput.files?.[0];if(!file)return;try{if(file.size>BACKUP_IMPORT_LIMIT)throw Error('Arquivo acima de 10 MB.');const data=validateBackupObject(JSON.parse(await file.text()));showBackupImportPreview(data,file.name)}catch(e){alert('Backup não importado: '+e.message)}});

restore=function(){beginBackupImport()};
